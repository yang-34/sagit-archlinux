name: wifi-services

# Cross-compile the aarch64 userspace QMI services the mi6 needs for Wi-Fi.
# The device rootfs has no gcc/make/meson/pkg-config, so this is built off-device.
# NOTE: no qrtr-ns here -- the QRTR name service has been in the kernel since
# Linux 5.7 (device has ns.ko loaded), and linux-msm/qrtr dropped the daemon.

on:
  workflow_dispatch:

concurrency:
  group: wifi-services-${{ github.ref }}
  cancel-in-progress: true

env:
  QRTR_SHA: 29e36ae164389580a0f8ea7a7fdb728140ae978d
  RMTFS_SHA: b30a3eb38f9af283f18dbd3c7755653efc52c094
  PDMAPPER_SHA: 5ecd2fe926aca7abfe40724177f63b942cff3947
  TQFTPSERV_SHA: eb4b9a04ff92d2753ededf32cc3b6ed287f6e29b
  # diag-router: required by degdag's verified mi6 Wi-Fi recipe, must start
  # BEFORE rmtfs/pd-mapper/tqftpserv.
  DIAG_SHA: 23c12c167e93215853af4e59c021551767f6fec8

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config git file \
            libudev-dev liblzma-dev libzstd-dev
          uname -m
          gcc --version | head -1
          meson --version

      - name: Clone and pin service sources
        run: |
          set -e
          clone() {
            git clone "https://github.com/linux-msm/$1.git" "$1"
            git -C "$1" checkout "$2"
            echo "$1 $(git -C "$1" rev-parse HEAD)"
          }
          clone qrtr      "$QRTR_SHA"
          clone rmtfs     "$RMTFS_SHA"
          clone pd-mapper "$PDMAPPER_SHA"
          clone tqftpserv "$TQFTPSERV_SHA"
          clone diag      "$DIAG_SHA"

      - name: Patch pd-mapper: full servreg instrumentation + PFR reply
        run: |
          set -eux
          python3 - <<'PY'
          import re, sys
          p = 'pd-mapper/pd-mapper.c'
          s = open(p).read()

          # 1) Log every SERVREG_LOC_GET_DOMAIN_LIST request: it tells us whether the
          #    modem actually asks pd-mapper for the PD that provides "wlan/fw".
          ins1 = ("\n\tfprintf(stderr, \"[PD-MAPPER] get_domain_list name='%s'\\n\", req.name);")
          s, n1 = re.subn(r"req\.name\[sizeof\(req\.name\)-1\] = '\\0';",
                          lambda m: m.group(0) + ins1, s, count=1)

          ins2 = ("fprintf(stderr, \"[PD-MAPPER] reply %u domain(s)\\n\", resp.domain_list_len);\n\t")
          s, n2 = re.subn(r"if \(resp\.domain_list_len\)\n\s*resp\.domain_list_valid = 1;",
                          lambda m: ins2 + m.group(0), s, count=1)

          # 2) Upstream only printf()s "pfr" on stdout, which is block-buffered when
          #    systemd captures it -> PFR events are invisible and, worse, never get
          #    a response. Decode it, log it to stderr and answer it, like the
          #    in-kernel qcom_pd_mapper.c does.
          pfr_fn = r'''
static void handle_pfr(int sock, const struct qrtr_packet *pkt)
{
	struct servreg_loc_pfr_resp resp = {};
	struct servreg_loc_pfr_req req = {};
	DEFINE_QRTR_PACKET(resp_buf, 64);
	unsigned int txn;
	ssize_t len;
	int ret;

	ret = qmi_decode_message(&req, &txn, pkt, QMI_REQUEST,
				 SERVREG_LOC_PFR, servreg_loc_pfr_req_ei);
	if (ret < 0) {
		fprintf(stderr, "[PD-MAPPER] PFR decode failed %d\n", ret);
		return;
	}
	req.service[sizeof(req.service) - 1] = '\0';
	req.reason[sizeof(req.reason) - 1] = '\0';
	fprintf(stderr, "[PD-MAPPER] PFR service='%s' reason='%s'\n",
		req.service, req.reason);

	resp.result.result = QMI_RESULT_SUCCESS;
	resp.result.error = QMI_ERR_NONE;
	len = qmi_encode_message(&resp_buf, QMI_RESPONSE, SERVREG_LOC_PFR,
				 txn, &resp, servreg_loc_pfr_resp_ei);
	if (len < 0) {
		fprintf(stderr, "[PD-MAPPER] PFR encode failed %d\n", (int)len);
		return;
	}

	ret = qrtr_sendto(sock, pkt->node, pkt->port,
			  resp_buf.data, resp_buf.data_len);
	if (ret < 0)
		fprintf(stderr, "[PD-MAPPER] PFR send failed %d\n", ret);
}

'''
          s, n3 = re.subn(r"static void handle_get_domain_list\(",
                          lambda m: pfr_fn.lstrip('\n') + m.group(0), s, count=1)

          # 3) Log every decoded QMI message id so unknown requests are visible.
          ins3 = ("fprintf(stderr, \"[PD-MAPPER] qmi msg_id=0x%02x\\n\", msg_id);\n\n\t\t\t")
          s, n4 = re.subn(r"switch \(msg_id\) \{",
                          lambda m: ins3 + m.group(0), s, count=1)

          # 4) Route PFR to the new handler instead of the silent printf().
          s, n5 = re.subn(r'case SERVREG_LOC_PFR:\n(\s*)printf\("\[PD-MAPPER\] pfr\\n"\);',
                          'case SERVREG_LOC_PFR:\n\\1handle_pfr(fd, &pkt);', s, count=1)

          # 5) Unbuffered stdout: keep journald-visible ordering with stderr.
          s, n6 = re.subn(r"(\n\tret = pd_load_maps\(\);)",
                          "\n\tsetvbuf(stdout, NULL, _IONBF, 0);\\1", s, count=1)

          if (n1, n2, n3, n4, n5, n6) != (1, 1, 1, 1, 1, 1):
              sys.exit('patch failed: %r' % ((n1, n2, n3, n4, n5, n6),))
          open(p, 'w').write(s)
          print('pd-mapper patched', (n1, n2, n3, n4, n5, n6))
          PY
          grep -n 'PD-MAPPER] get_domain_list\|PD-MAPPER] reply\|PD-MAPPER] qmi msg_id\|handle_pfr\|setvbuf' pd-mapper/pd-mapper.c

      - name: Build and stage aarch64 binaries
        run: |
          set -eux
          ST="$PWD/stage"
          mkdir -p "$ST"

          # 1) qrtr (meson): libqrtr + qrtr.pc + qrtr-cfg/qrtr-lookup.
          #    Install system-wide first so downstream -lqrtr / pkg-config work,
          #    then install a second copy into the staging tree for the artifact.
          meson setup qrtr/b qrtr --prefix=/usr
          meson compile -C qrtr/b
          # Staging install MUST come first: a root install beforehand makes
          # meson-logs/install-log.txt root-owned and the unprivileged DESTDIR
          # install then fails with PermissionError (run 42580711856).
          DESTDIR="$ST" meson install -C qrtr/b
          sudo meson install -C qrtr/b
          sudo ldconfig
          pkg-config --modversion qrtr
          pkg-config --cflags --libs qrtr

          # 2) rmtfs (Makefile): -lqrtr -ludev -lpthread
          make -C rmtfs prefix=/usr
          make -C rmtfs prefix=/usr DESTDIR="$ST" install

          # 3) pd-mapper (Makefile): -lqrtr -llzma
          make -C pd-mapper prefix=/usr
          make -C pd-mapper prefix=/usr DESTDIR="$ST" install

          # 4) tqftpserv (meson): serves wlanmdsp.mbn to the modem over QRTR
          meson setup tqftpserv/b tqftpserv --prefix=/usr
          meson compile -C tqftpserv/b
          DESTDIR="$ST" meson install -C tqftpserv/b

          # 5) diag (Makefile): diag-router routes DIAG messages to the modem;
          #    degdag's mi6 recipe starts it before the three QMI services.
          make -C diag prefix=/usr
          make -C diag prefix=/usr DESTDIR="$ST" install

          find "$ST" -type f | sort | head -60

      - name: Assemble deployable artifact
        run: |
          set -eux
          ST="$PWD/stage"
          OUT="$PWD/out"
          mkdir -p "$OUT/bin" "$OUT/lib" "$OUT/units"
          for b in qrtr-cfg qrtr-lookup rmtfs pd-mapper tqftpserv diag-router send_data; do
            f=$(find "$ST" -type f -name "$b" -perm -u+x | head -1)
            if [ -z "$f" ]; then echo "MISSING BINARY: $b"; exit 1; fi
            cp -a "$f" "$OUT/bin/$b"
          done
          find "$ST" \( -name 'libqrtr.so' -o -name 'libqrtr.so.*' \) \
            -exec cp -a {} "$OUT/lib/" \;
          find "$ST" -name '*.service' -exec cp -a {} "$OUT/units/" \; || true
          {
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "arch: $(uname -m)"
            echo "qrtr:      $QRTR_SHA"
            echo "rmtfs:     $RMTFS_SHA"
            echo "pd-mapper: $PDMAPPER_SHA"
            echo "tqftpserv: $TQFTPSERV_SHA"
            echo "diag:      $DIAG_SHA"
          } > "$OUT/BUILDINFO.txt"
          file "$OUT"/bin/*
          ls -lhR "$OUT"

      - name: Package and checksum
        run: |
          tar -czf wifi-services.tar.gz -C out .
          sha256sum wifi-services.tar.gz
          ls -lh wifi-services.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: wifi-services
          path: wifi-services.tar.gz
          retention-days: 30
