name: build

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/degdag/W.I.P_sagit_mainline.git
  KERNEL_BRANCH: master
  ARCH: arm64
  CROSS: aarch64-linux-gnu-
  ROOTFS_BYTES: "56446922752"
  ROOTFS_URL: https://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
          nproc

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev \
            device-tree-compiler cpio xz-utils zstd curl \
            abootimg android-sdk-libsparse-utils qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64 || true
          command -v img2simg || echo "no img2simg, will use python fallback"

      - name: Clone kernel source
        run: |
          git clone --depth 1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          git log -1 --oneline
          ls arch/arm64/configs/ | grep -i sagit

      - name: Patch TFA9890 revision (Mi6 amp reports 0x88)
        run: |
          cd kernel
          sed -i 's/#define TFA9890_REVISION[[:space:]]*0x80/#define TFA9890_REVISION 0x88/' sound/soc/codecs/tfa989x.c
          grep -n 'TFA9890_REVISION' sound/soc/codecs/tfa989x.c | head

      - name: Patch GPU bring-up bisect gates (module param debug_stage bitmask)
        run: |
          cd kernel
          python3 "$GITHUB_WORKSPACE/scripts/patch_bisect.py" .
          grep -rn 'BISECT: bit' drivers/gpu/drm/msm/adreno/ | head -12 || true
          grep -n 'module_param_named(debug_stage' drivers/gpu/drm/msm/adreno/adreno_device.c || true

      - name: Patch DSI diagnostics (build-63 regression baseline)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          def patch(path, old, new):
              s = open(path).read()
              assert s.count(old) == 1, (path, s.count(old), old[:70])
              open(path, "w").write(s.replace(old, new, 1))
              print("patched", path)

          # 1) who computed what: pclk/bclk inputs to the PHY clock request
          patch("drivers/gpu/drm/msm/dsi/dsi_host.c",
                '\tDBG("pclk=%d, bclk=%d", msm_host->pixel_clk_rate,\n'
                '\t\t\t\tmsm_host->byte_clk_rate);\n',
                '\tDBG("pclk=%d, bclk=%d", msm_host->pixel_clk_rate,\n'
                '\t\t\t\tmsm_host->byte_clk_rate);\n'
                '\tpr_info("dsi_calc: pclk=%u bclk=%u lanes=%u bpp=%u bonded=%d mode_clock=%u\\n",\n'
                '\t\tmsm_host->pixel_clk_rate, msm_host->byte_clk_rate, lanes, bpp,\n'
                '\t\t(int)is_bonded_dsi, msm_host->mode ? msm_host->mode->clock : 0);\n')

          # 2) actual rates the clock framework/PHY really programmed
          patch("drivers/gpu/drm/msm/dsi/dsi_host.c",
                '\tret = cfg_hnd->ops->link_clk_set_rate(msm_host);\n'
                '\tif (!ret)\n'
                '\t\tret = cfg_hnd->ops->link_clk_enable(msm_host);\n',
                '\tret = cfg_hnd->ops->link_clk_set_rate(msm_host);\n'
                '\tif (!ret)\n'
                '\t\tret = cfg_hnd->ops->link_clk_enable(msm_host);\n'
                '\tif (!ret)\n'
                '\t\tpr_info("dsi_pwr: pclk=%u bclk=%u byte_clk=%lu pixel_clk=%lu src_clk=%lu\\n",\n'
                '\t\t\tmsm_host->pixel_clk_rate, msm_host->byte_clk_rate,\n'
                '\t\t\tclk_get_rate(msm_host->byte_clk),\n'
                '\t\t\tmsm_host->pixel_clk ? clk_get_rate(msm_host->pixel_clk) : 0UL,\n'
                '\t\t\tmsm_host->src_clk ? clk_get_rate(msm_host->src_clk) : 0UL);\n')

          # 3) DRM mode vs adjusted mode reaching the DSI bridge
          patch("drivers/gpu/drm/msm/dsi/dsi_manager.c",
                '\tDBG("set mode: " DRM_MODE_FMT, DRM_MODE_ARG(mode));\n',
                '\tDBG("set mode: " DRM_MODE_FMT, DRM_MODE_ARG(mode));\n'
                '\tpr_info("dsi_mgr_mode_set: clock=%u adjusted=%u htotal=%u vtotal=%u bonded=%d\\n",\n'
                '\t\tmode->clock, adjusted_mode->clock, adjusted_mode->htotal,\n'
                '\t\tadjusted_mode->vtotal, (int)is_bonded_dsi);\n')

          # 4) panel keeps upstream video-burst flags (regression baseline)
          # 5) on() sets LPM and never clears it; also dump panel state
          patch("drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c",
                '\tdsi_generic_write_seq(dsi, 0xb0, 0x03);\n'
                '\n'
                '\treturn 0;\n'
                '}\n'
                '\n'
                'static int jdi_fhd_r63452_off',
                '\tdsi_generic_write_seq(dsi, 0xb0, 0x03);\n'
                '\n'
                '\t{\n'
                '\t\tu8 val = 0;\n'
                '\t\tint rc;\n'
                '\n'
                '\t\tpr_info("panel: flags_in=0x%lx\\n", dsi->mode_flags);\n'
                '\t\trc = mipi_dsi_dcs_read(dsi, MIPI_DCS_GET_POWER_MODE, &val, 1);\n'
                '\t\tpr_info("panel: power_mode rc=%d val=0x%02x\\n", rc, val);\n'
                '\t\tval = 0;\n'
                '\t\trc = mipi_dsi_dcs_read(dsi, 0xda, &val, 1);\n'
                '\t\tpr_info("panel: id_da rc=%d val=0x%02x\\n", rc, val);\n'
                '\t\tval = 0;\n'
                '\t\trc = mipi_dsi_dcs_read(dsi, 0xdb, &val, 1);\n'
                '\t\tpr_info("panel: id_db rc=%d val=0x%02x\\n", rc, val);\n'
                '\t\tval = 0;\n'
                '\t\trc = mipi_dsi_dcs_read(dsi, MIPI_DCS_GET_DISPLAY_STATUS, &val, 1);\n'
                '\t\tpr_info("panel: display_status rc=%d val=0x%02x\\n", rc, val);\n'
                '\t\tval = 0;\n'
                '\t\trc = mipi_dsi_dcs_read(dsi, MIPI_DCS_READ_DDB_START, &val, 1);\n'
                '\t\tpr_info("panel: ddb_start rc=%d val=0x%02x\\n", rc, val);\n'
                '\t}\n'
                '\n'
                '\tdsi->mode_flags &= ~MIPI_DSI_MODE_LPM;\n'
                '\tpr_info("panel: flags_out=0x%lx\\n", dsi->mode_flags);\n'
                '\tpr_info("panel: on end t=%llu\\n", ktime_get_ns());\n'
                '\n'
                '\treturn 0;\n'
                '}\n'
                '\n'
                'static int jdi_fhd_r63452_off')
          # 6) per-command return values + stage timestamps
          patch("drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c",
                '\t\tret = mipi_dsi_generic_write(dsi, d, ARRAY_SIZE(d));\t\\\n'
                '\t\tif (ret < 0)\t\t\t\t\t\t\\\n',
                '\t\tret = mipi_dsi_generic_write(dsi, d, ARRAY_SIZE(d));\t\\\n'
                '\t\tpr_info("panel: gen %02x ret=%d\\n", d[0], ret);\t\\\n'
                '\t\tif (ret < 0)\t\t\t\t\t\t\\\n')
          patch("drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c",
                '\t\tret = mipi_dsi_dcs_write_buffer(dsi, d, ARRAY_SIZE(d));\t\\\n'
                '\t\tif (ret < 0)\t\t\t\t\t\t\\\n',
                '\t\tret = mipi_dsi_dcs_write_buffer(dsi, d, ARRAY_SIZE(d));\t\\\n'
                '\t\tpr_info("panel: dcs %02x ret=%d\\n", d[0], ret);\t\\\n'
                '\t\tif (ret < 0)\t\t\t\t\t\t\\\n')
          patch("drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c",
                '#include <linux/delay.h>\n',
                '#include <linux/delay.h>\n#include <linux/ktime.h>\n')
          patch("drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c",
                'static int jdi_fhd_r63452_prepare(struct drm_panel *panel)\n{\n',
                'static int jdi_fhd_r63452_prepare(struct drm_panel *panel)\n{\n'
                '\tpr_info("panel: prepare t=%llu\\n", ktime_get_ns());\n')
          patch("drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c",
                'static int jdi_fhd_r63452_on(struct jdi_fhd_r63452 *ctx)\n{\n\tstruct mipi_dsi_device *dsi = ctx->dsi;\n\tstruct device *dev = &dsi->dev;\n\tint ret;\n',
                'static int jdi_fhd_r63452_on(struct jdi_fhd_r63452 *ctx)\n{\n\tstruct mipi_dsi_device *dsi = ctx->dsi;\n\tstruct device *dev = &dsi->dev;\n\tint ret;\n\n\tpr_info("panel: on start t=%llu\\n", ktime_get_ns());\n')
          PYEOF
          grep -n 'dsi_calc: pclk' drivers/gpu/drm/msm/dsi/dsi_host.c
          grep -n 'dsi_pwr: pclk' drivers/gpu/drm/msm/dsi/dsi_host.c
          grep -n 'dsi_mgr_mode_set' drivers/gpu/drm/msm/dsi/dsi_manager.c
          grep -n -A4 'dsi->mode_flags = MIPI_DSI_MODE_VIDEO' drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c

      - name: Vendor DPHY timing override + TE irq counter (build-74)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          def patch(path, old, new):
              s = open(path).read()
              assert s.count(old) == 1, (path, s.count(old), old[:60])
              open(path, "w").write(s.replace(old, new, 1))
              print("patched", path)

          # 1) module switch + vendor t-clk-pre/post override
          patch("drivers/gpu/drm/msm/dsi/phy/dsi_phy.c",
                '#include "dsi_phy.h"\n\n#define S_DIV_ROUND_UP',
                '#include "dsi_phy.h"\n'
                '\n'
                '#include <linux/module.h>\n'
                '\n'
                '/*\n'
                ' * BISECT-73: vendor panel DTSI hardcodes t-clk-pre = 0x28 and\n'
                ' * t-clk-post = 0x07.  Force those two PHY timing fields instead of\n'
                ' * the values computed from the bit rate; set\n'
                ' * force_vendor_dphy_timing=0 to compare with the computed ones.\n'
                ' */\n'
                'static bool force_vendor_dphy_timing = true;\n'
                'module_param(force_vendor_dphy_timing, bool, 0644);\n'
                'MODULE_PARM_DESC(force_vendor_dphy_timing,\n'
                '\t\t "use vendor t-clk-pre/t-clk-post instead of computed values");\n'
                '\n'
                '#define S_DIV_ROUND_UP')

          pp = "drivers/gpu/drm/msm/dsi/phy/dsi_phy.c"
          t = open(pp).read()
          start = t.index("int msm_dsi_dphy_timing_calc_v3")
          idx = t.index("\ttiming->ta_go = 3;\n", start)
          override = ('\tif (force_vendor_dphy_timing) {\n'
                      '\t\tpr_info("dsi_phy: computed clk_pre=%d clk_post=%d -> vendor 0x28/0x07\\n",\n'
                      '\t\t\ttiming->shared_timings.clk_pre,\n'
                      '\t\t\ttiming->shared_timings.clk_post);\n'
                      '\t\ttiming->shared_timings.clk_pre = 0x28;\n'
                      '\t\ttiming->shared_timings.clk_post = 0x07;\n'
                      '\t\ttiming->shared_timings.clk_pre_inc_by_2 = 0;\n'
                      '\t\t/* vendor panel-timings = 00 1a 07 06 0a 11 07 07 05 03 04 00 */\n'
                      '\t\ttiming->hs_halfbyte_en = 0x00;\n'
                      '\t\ttiming->clk_zero = 0x1a;\n'
                      '\t\ttiming->clk_prepare = 0x07;\n'
                      '\t\ttiming->clk_trail = 0x06;\n'
                      '\t\ttiming->hs_exit = 0x0a;\n'
                      '\t\ttiming->hs_zero = 0x11;\n'
                      '\t\ttiming->hs_prepare = 0x07;\n'
                      '\t\ttiming->hs_trail = 0x07;\n'
                      '\t\ttiming->hs_rqst = 0x05;\n'
                      '\t}\n'
                      '\n')
          t = t[:idx] + override + t[idx:]
          open(pp, "w").write(t)
          print("vendor timing override inserted in v3")

          # 2) TE gpio irq counter so /proc/interrupts shows panel scanning
          patch("drivers/gpu/drm/msm/dsi/dsi_host.c",
                '\tstruct gpio_desc *disp_en_gpio;\n'
                '\tstruct gpio_desc *te_gpio;\n',
                '\tstruct gpio_desc *disp_en_gpio;\n'
                '\tstruct gpio_desc *te_gpio;\n'
                '\tint te_irq;\n'
                '\tatomic_t te_count;\n')

          patch("drivers/gpu/drm/msm/dsi/dsi_host.c",
                'static int dsi_host_init_panel_gpios(struct msm_dsi_host *msm_host,\n'
                '\t\t\tstruct device *panel_device)\n'
                '{\n',
                'static irqreturn_t dsi_te_irq_handler(int irq, void *data)\n'
                '{\n'
                '\tstruct msm_dsi_host *msm_host = data;\n'
                '\n'
                '\tatomic_inc(&msm_host->te_count);\n'
                '\treturn IRQ_HANDLED;\n'
                '}\n'
                '\n'
                'static int dsi_host_init_panel_gpios(struct msm_dsi_host *msm_host,\n'
                '\t\t\tstruct device *panel_device)\n'
                '{\n')

          patch("drivers/gpu/drm/msm/dsi/dsi_host.c",
                '\tif (IS_ERR(msm_host->te_gpio)) {\n'
                '\t\tDBG("cannot get disp-te-gpios %ld", PTR_ERR(msm_host->te_gpio));\n'
                '\t\treturn PTR_ERR(msm_host->te_gpio);\n'
                '\t}\n'
                '\n'
                '\treturn 0;\n'
                '}\n',
                '\tif (IS_ERR(msm_host->te_gpio)) {\n'
                '\t\tDBG("cannot get disp-te-gpios %ld", PTR_ERR(msm_host->te_gpio));\n'
                '\t\treturn PTR_ERR(msm_host->te_gpio);\n'
                '\t}\n'
                '\n'
                '\tif (msm_host->te_gpio) {\n'
                '\t\tmsm_host->te_irq = gpiod_to_irq(msm_host->te_gpio);\n'
                '\t\tif (msm_host->te_irq > 0) {\n'
                '\t\t\tif (devm_request_irq(&msm_host->pdev->dev,\n'
                '\t\t\t\t\t\t      msm_host->te_irq,\n'
                '\t\t\t\t\t\t      dsi_te_irq_handler,\n'
                '\t\t\t\t\t\t      IRQF_TRIGGER_RISING,\n'
                '\t\t\t\t\t\t      "dsi_te", msm_host))\n'
                '\t\t\t\tpr_err("dsi_te: cannot request irq %d\\n",\n'
                '\t\t\t\t       msm_host->te_irq);\n'
                '\t\t\telse\n'
                '\t\t\t\tpr_info("dsi_te: irq %d registered\\n",\n'
                '\t\t\t\t\tmsm_host->te_irq);\n'
                '\t\t} else {\n'
                '\t\t\tpr_info("dsi_te: gpio has no irq (%d)\\n", msm_host->te_irq);\n'
                '\t\t}\n'
                '\t}\n'
                '\n'
                '\treturn 0;\n'
                '}\n')
          PYEOF
          grep -n 'force_vendor_dphy_timing' drivers/gpu/drm/msm/dsi/phy/dsi_phy.c | head -5
          grep -n 'dsi_te' drivers/gpu/drm/msm/dsi/dsi_host.c | head -8

      - name: Clean display bringup page0 fix quiet logs (build-82)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          p = "drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c"
          s = open(p).read()

          helper = r"""
          static bool page0_fix = true;

          static int jdi_page0(struct mipi_dsi_device *dsi)
          {
              u8 zero = 0x00;
              int ret;

              ret = mipi_dsi_dcs_write(dsi, 0xb0, &zero, 1);
              pr_info("panel: page0 ret=%d\n", ret);
              return ret;
          }

          """

          anchor = "static int jdi_fhd_r63452_on(struct jdi_fhd_r63452 *ctx)\n"
          assert s.count(anchor) == 1, s.count(anchor)
          s = s.replace(anchor, helper + anchor, 1)

          i = s.index("\tdsi->mode_flags &= ~MIPI_DSI_MODE_LPM;\n")
          s = s[:i] + "\tif (page0_fix)\n\t\tjdi_page0(dsi);\n" + s[i:]
          open(p, "w").write(s)
          print("page0 fix inserted before LPM clear")

          hp = "drivers/gpu/drm/msm/dsi/dsi_host.c"
          h = open(hp).read()

          inc = '#include <linux/delay.h>\n'
          assert h.count(inc) == 1
          h = h.replace(inc, inc + '#include <linux/module.h>\n#include <linux/ktime.h>\n', 1)

          gate_fn = ('static bool te_gate_wr_mem = true;\n'
                     'module_param(te_gate_wr_mem, bool, 0644);\n'
                     '\n'
                     'static int dsi_wait_te_edge(struct msm_dsi_host *msm_host)\n'
                     '{\n'
                     '\tint base = atomic_read(&msm_host->te_count);\n'
                     '\tint i;\n'
                     '\n'
                     '\tfor (i = 0; i < 200; i++) {\n'
                     '\t\tif (atomic_read(&msm_host->te_count) != base)\n'
                     '\t\t\treturn 0;\n'
                     '\t\tusleep_range(200, 300);\n'
                     '\t}\n'
                     '\treturn -ETIMEDOUT;\n'
                     '}\n'
                     '\n'
                     'static void dsi_log_dcs_cmd(struct msm_dsi_host *msm_host,\n'
                     '\t\t\t    const struct mipi_dsi_msg *msg)\n'
                     '{\n'
                     '\tconst u8 *p = msg->tx_buf;\n'
                     '\tint n = msg->tx_len;\n'
                     '\tstatic int seq;\n'
                     '\n'
                     '\tif (n <= 0 || !p)\n'
                     '\t\treturn;\n'
                     '\tseq++;\n'
                     '\tif (seq > 60)\n'
                     '\t\treturn;\n'
                     '\tpr_info("dsi_seq %03d: cmd=%02x type=%02x vc=%02x len=%d rx=%d lpm=%d te=%d data=%02x %02x %02x %02x %02x\\n",\n'
                     '\t\tseq, p[0], msg->type, msg->channel, n, (int)msg->rx_len,\n'
                     '\t\t!!(msg->flags & MIPI_DSI_MSG_USE_LPM),\n'
                     '\t\tatomic_read(&msm_host->te_count), p[0],\n'
                     '\t\tn > 1 ? p[1] : 0, n > 2 ? p[2] : 0,\n'
                     '\t\tn > 3 ? p[3] : 0, n > 4 ? p[4] : 0);\n'
                     '}\n'
                     '\n'
                     'static void dsi_dump_state(struct msm_dsi_host *msm_host,\n'
                     '\t\t\t  const char *tag)\n'
                     '{\n'
                     '\tpr_info("dsi_state %s: ctrl=0x%08x cfg0=0x%08x cfg1=0x%08x mdp0=0x%08x trig=0x%08x dma=0x%08x\\n",\n'
                     '\t\ttag,\n'
                     '\t\tdsi_read(msm_host, REG_DSI_CTRL),\n'
                     '\t\tdsi_read(msm_host, REG_DSI_CMD_CFG0),\n'
                     '\t\tdsi_read(msm_host, REG_DSI_CMD_CFG1),\n'
                     '\t\tdsi_read(msm_host, REG_DSI_CMD_MDP_STREAM0_CTRL),\n'
                     '\t\tdsi_read(msm_host, REG_DSI_TRIG_CTRL),\n'
                     '\t\tdsi_read(msm_host, REG_DSI_CMD_DMA_CTRL));\n'
                     '}\n'
                     '\n')

          anchor2 = 'static ssize_t dsi_host_transfer(struct mipi_dsi_host *host,\n'
          assert h.count(anchor2) == 1, h.count(anchor2)
          h = h.replace(anchor2, gate_fn + anchor2, 1)

          old2 = ('\tif (!msg || !msm_host->power_on)\n'
                  '\t\treturn -EINVAL;\n'
                  '\n'
                  '\tmutex_lock(&msm_host->cmd_mutex);\n'
                  '\tret = msm_dsi_manager_cmd_xfer(msm_host->id, msg);\n'
                  '\tmutex_unlock(&msm_host->cmd_mutex);\n'
                  '\n'
                  '\treturn ret;\n'
                  '}\n')
          new2 = ('\tif (!msg || !msm_host->power_on)\n'
                  '\t\treturn -EINVAL;\n'
                  '\n'
                  '\tdsi_log_dcs_cmd(msm_host, msg);\n'
                  '\n'
                  '\tif (te_gate_wr_mem && msg->tx_len > 0 &&\n'
                  '\t    ((const u8 *)msg->tx_buf)[0] == MIPI_DCS_WRITE_MEMORY_START) {\n'
                  '\t\tint gate = dsi_wait_te_edge(msm_host);\n'
                  '\n'
                  '\t\tpr_info("dsi_xfer: te_gate rc=%d te=%d\\n", gate,\n'
                  '\t\t\tatomic_read(&msm_host->te_count));\n'
                  '\t}\n'
                  '\n'
                  '\tmutex_lock(&msm_host->cmd_mutex);\n'
                  '\tret = msm_dsi_manager_cmd_xfer(msm_host->id, msg);\n'
                  '\tif (ret < 0 && msg->tx_len > 0) {\n'
                  '\t\tpr_err("dsi_recover: xfer err %d cmd=%02x, sw_reset\\n",\n'
                  '\t\t\tret, ((const u8 *)msg->tx_buf)[0]);\n'
                  '\t\tdsi_sw_reset_restore(msm_host);\n'
                  '\t\tdsi_dump_state(msm_host, "recover");\n'
                  '\t}\n'
                  '\tmutex_unlock(&msm_host->cmd_mutex);\n'
                  '\n'
                  '\treturn ret;\n'
                  '}\n')
          assert h.count(old2) == 1, h.count(old2)
          h = h.replace(old2, new2, 1)

          oldop = ('\tu32 dsi_ctrl;\n'
                   '\n'
                   '\tdsi_ctrl = dsi_read(msm_host, REG_DSI_CTRL);\n')
          newop = ('\tu32 dsi_ctrl;\n'
                   '\n'
                   '\tpr_info("dsi_op_mode: video=%d enable=%d\\n",\n'
                   '\t\tvideo_mode, enable);\n'
                   '\tdsi_ctrl = dsi_read(msm_host, REG_DSI_CTRL);\n')
          assert h.count(oldop) == 1, h.count(oldop)
          h = h.replace(oldop, newop, 1)

          oldwc = ('\t\t/* image data and 1 byte write_memory_start cmd */\n'
                   '\t\twc = hdisplay * dsi_get_bpp(msm_host->format) / 8 + 1;\n')
          assert h.count(oldwc) == 1, h.count(oldwc)
          h = h.replace(oldwc, oldwc +
                        '\t\tpr_info("dsi_timing: cmd wc=%u hdisplay=%u vdisplay=%u\\n",\n'
                        '\t\t\twc, hdisplay, mode->vdisplay);\n', 1)

          oldpw = '\tdsi_ctrl_config(msm_host, true, phy_shared_timings, phy);\n'
          newpw = oldpw + '\tdsi_dump_state(msm_host, "power_on");\n'
          assert h.count(oldpw) == 1, h.count(oldpw)
          h = h.replace(oldpw, newpw, 1)
          open(hp, "w").write(h)
          print("dsi_host quiet log + recovery patched")
          PYEOF
          grep -n 'jdi_page0\|page0_fix' drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c | head -6
          grep -n 'dsi_seq %03d\|dsi_timing: cmd\|dsi_op_mode:' drivers/gpu/drm/msm/dsi/dsi_host.c | head -8
          grep -n 'test_fill\|jdi_probe_fill\|jdi_fill_full' drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c | head -5 || true

      - name: Probe committed plane fb pixels (build-84, module param)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          def patch(path, old, new):
              s = open(path).read()
              assert s.count(old) == 1, (path, s.count(old), old[:60])
              open(path, "w").write(s.replace(old, new, 1))
              print("patched", path)

          p = "drivers/gpu/drm/msm/disp/dpu1/dpu_plane.c"
          patch(p, '#include "msm_drv.h"\n',
                '#include <linux/module.h>\n'
                '#include <drm/drm_framebuffer.h>\n'
                '#include "msm_drv.h"\n#include "msm_gem.h"\n')

          helper = r"""
          static int fb_probe;
          module_param_named(fb_probe, fb_probe, int, 0644);
          MODULE_PARM_DESC(fb_probe, "log committed plane fb contents (0=off)");

          static int dpu_probe_seq;
          static int dpu_probe_base_id = -1;
          static int dpu_probe_base_prints;
          static struct drm_framebuffer *dpu_probe_late_fb;

          static void dpu_dump_fb(struct drm_framebuffer *fb, const char *tag,
                                  int seq)
          {
              void *addr;
              u32 *p;
              unsigned int x, y, pitch, nsamp = 0, nblack = 0;
              u32 first[8] = { 0 };
              u32 flags = 0;
              int i;

              addr = msm_gem_get_vaddr(fb->obj[0]);
              if (!addr) {
                  pr_info("dpu_fb %s %d: no vaddr id=%d\n",
                          tag, seq, fb->base.id);
                  return;
              }
              if (!fb->obj[0]->import_attach)
                  flags = to_msm_bo(fb->obj[0])->flags;
              p = addr;
              pitch = fb->pitches[0] / 4;
              for (i = 0; i < 8; i++)
                  first[i] = p[i];
              for (y = 0; y < fb->height; y += 32) {
                  for (x = 0; x < fb->width; x += 32) {
                      u32 v = p[y * pitch + x];

                      nsamp++;
                      if (v & 0x00ffffff)
                          nblack++;
                  }
              }
              pr_info("dpu_fb %s %d: id=%d fl=%08x fmt=%08x mod=%llx %ux%u pitch=%u nonblack=%u/%u px=%08x %08x %08x %08x %08x %08x %08x %08x\n",
                      tag, seq, fb->base.id, flags, fb->format->format,
                      (unsigned long long)fb->modifier,
                      fb->width, fb->height, fb->pitches[0], nblack, nsamp,
                      first[0], first[1], first[2], first[3],
                      first[4], first[5], first[6], first[7]);
              msm_gem_put_vaddr(fb->obj[0]);
          }

          static void dpu_probe_fb(struct drm_framebuffer *fb)
          {
              if (!fb_probe || !fb || !fb->obj[0])
                  return;

              if (dpu_probe_base_id < 0)
                  dpu_probe_base_id = fb->base.id;

              if (fb->base.id == dpu_probe_base_id) {
                  if (++dpu_probe_base_prints > 3)
                      return;
              } else {
                  dpu_probe_seq++;
                  if (dpu_probe_seq > 400)
                      return;
                  if (dpu_probe_seq == 30 && !dpu_probe_late_fb) {
                      dpu_probe_late_fb = fb;
                      drm_framebuffer_get(fb);
                  }
                  if (dpu_probe_seq == 60 && dpu_probe_late_fb) {
                      dpu_dump_fb(dpu_probe_late_fb, "late", 0);
                      drm_framebuffer_put(dpu_probe_late_fb);
                      dpu_probe_late_fb = NULL;
                  }
              }
              dpu_dump_fb(fb, "now", dpu_probe_seq);
          }

          """

          anchor = "static void dpu_plane_atomic_update(struct drm_plane *plane,\n"
          assert open(p).read().count(anchor) == 1
          s = open(p).read().replace(anchor, helper + anchor, 1)

          old = ('\tif (!new_state->visible) {\n'
               '\t\t_dpu_plane_atomic_disable(plane);\n'
               '\t} else {\n'
               '\t\tdpu_plane_sspp_atomic_update(plane);\n'
               '\t}\n')
          new = ('\tif (!new_state->visible) {\n'
               '\t\t_dpu_plane_atomic_disable(plane);\n'
               '\t} else {\n'
               '\t\tdpu_probe_fb(new_state->fb);\n'
               '\t\tdpu_plane_sspp_atomic_update(plane);\n'
               '\t}\n')
          assert s.count(old) == 1, s.count(old)
          open(p, "w").write(s.replace(old, new, 1))
          print("dpu fb pixel probe inserted")
          PYEOF
          grep -n 'module_param_named(fb_probe' drivers/gpu/drm/msm/disp/dpu1/dpu_plane.c
          grep -n 'dpu_probe_fb' drivers/gpu/drm/msm/disp/dpu1/dpu_plane.c | head -8

      - name: Pin GPU to max OPP, no freq ramp (build-85)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          def patch(path, old, new):
              s = open(path).read()
              assert s.count(old) == 1, (path, s.count(old), old[:80])
              open(path, "w").write(s.replace(old, new, 1))
              print("patched", path)

          p = "drivers/gpu/drm/msm/msm_gpu_devfreq.c"

          # 1) helper: highest OPP frequency
          old_t = ('static int msm_devfreq_target(struct device *dev, unsigned long *freq,\n'
                   '\t\tu32 flags)\n')
          new_t = ('/*\n'
                   ' * BISECT-85: highest OPP of the GPU.  gfx3d_clk_src transitions\n'
                   ' * flicker the DSI panel on msm8998, so we keep the clock pinned.\n'
                   ' */\n'
                   'static unsigned long msm_devfreq_max_freq(struct msm_gpu *gpu)\n'
                   '{\n'
                   '\tstruct device *dev = &gpu->pdev->dev;\n'
                   '\tstruct dev_pm_opp *opp;\n'
                   '\tunsigned long freq = ~0UL;\n'
                   '\n'
                   '\topp = dev_pm_opp_find_freq_floor(dev, &freq);\n'
                   '\tif (IS_ERR(opp))\n'
                   '\t\treturn gpu->fast_rate;\n'
                   '\n'
                   '\tfreq = dev_pm_opp_get_freq(opp);\n'
                   '\tdev_pm_opp_put(opp);\n'
                   '\n'
                   '\treturn freq;\n'
                   '}\n'
                   '\n'
                   'static int msm_devfreq_target(struct device *dev, unsigned long *freq,\n'
                   '\t\tu32 flags)\n')
          patch(p, old_t, new_t)

          # 2) active: pin to max OPP instead of idle_freq * 2
          old_a = ('\tif (idle_time > msm_devfreq_profile.polling_ms/2) {\n'
                   '\t\ttarget_freq *= 2;\n'
                   '\t}\n'
                   '\n'
                   '\tdf->idle_freq = 0;\n')
          new_a = ('\t/*\n'
                   '\t * BISECT-85: always jump straight to the highest OPP.\n'
                   '\t * Stock code doubles idle_freq on every activation, which\n'
                   '\t * makes gfx3d_clk_src change on nearly every submission.\n'
                   '\t */\n'
                   '\ttarget_freq = msm_devfreq_max_freq(gpu);\n'
                   '\t(void)idle_time;\n'
                   '\n'
                   '\tdf->idle_freq = 0;\n')
          patch(p, old_a, new_a)

          # 3) idle: never clamp down
          old_i = ('\tif (gpu->clamp_to_idle)\n'
                   '\t\tmsm_devfreq_target(&gpu->pdev->dev, &target_freq, 0);\n')
          new_i = ('\t/* BISECT-85: keep the clock at max OPP even while idle */\n'
                   '\tif (0 && gpu->clamp_to_idle)\n'
                   '\t\tmsm_devfreq_target(&gpu->pdev->dev, &target_freq, 0);\n')
          patch(p, old_i, new_i)

          # 4) init: start at max OPP, no idle clamp
          old_n = '\tmsm_devfreq_profile.initial_freq = gpu->fast_rate;\n'
          new_n = ('\t/* BISECT-85: boot straight into the highest OPP */\n'
                   '\tgpu->clamp_to_idle = false;\n'
                   '\tmsm_devfreq_profile.initial_freq = msm_devfreq_max_freq(gpu);\n')
          patch(p, old_n, new_n)
          PYEOF
          grep -n 'msm_devfreq_max_freq' drivers/gpu/drm/msm/msm_gpu_devfreq.c
          grep -n 'BISECT-85' drivers/gpu/drm/msm/msm_gpu_devfreq.c
          grep -n 'dev_pm_opp_find_freq_floor' drivers/gpu/drm/msm/msm_gpu_devfreq.c

      - name: Pin GPU clock at init, keep governor suspended (build-86)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          def patch(path, old, new):
              s = open(path).read()
              assert s.count(old) == 1, (path, s.count(old), old[:80])
              open(path, "w").write(s.replace(old, new, 1))
              print("patched", path)

          p = "drivers/gpu/drm/msm/msm_gpu_devfreq.c"

          # 1) max_freq helper: trust gpu->fast_rate (already fastest OPP)
          old_h = ('\topp = dev_pm_opp_find_freq_floor(dev, &freq);\n'
                   '\tif (IS_ERR(opp))\n'
                   '\t\treturn gpu->fast_rate;\n'
                   '\n'
                   '\tfreq = dev_pm_opp_get_freq(opp);\n')
          new_h = ('\t/*\n'
                   '\t * BISECT-86: gpu->fast_rate is filled by\n'
                   '\t * adreno_get_pwrlevels() using ULONG_MAX, i.e. the fastest\n'
                   '\t * OPP.  Prefer it so we do not depend on OPP table state.\n'
                   '\t */\n'
                   '\tif (gpu->fast_rate)\n'
                   '\t\treturn gpu->fast_rate;\n'
                   '\n'
                   '\topp = dev_pm_opp_find_freq_floor(dev, &freq);\n'
                   '\tif (IS_ERR(opp))\n'
                   '\t\treturn 0;\n'
                   '\n'
                   '\tfreq = dev_pm_opp_get_freq(opp);\n')
          patch(p, old_h, new_h)

          # 2) init: program the hardware clock once, at the fastest OPP
          old_s = ('\tdevfreq_suspend_device(gpu->devfreq.devfreq);\n'
                   '\n'
                   '\tgpu->cooling = ')
          new_s = ('\tdevfreq_suspend_device(gpu->devfreq.devfreq);\n'
                   '\n'
                   '\t/*\n'
                   '\t * BISECT-86: pin the hardware clock at the fastest OPP.\n'
                   '\t * The governor stays suspended forever, so nothing can\n'
                   '\t * ever switch gfx3d_clk_src again.\n'
                   '\t */\n'
                   '\tif (gpu->fast_rate) {\n'
                   '\t\tclk_set_rate(gpu->core_clk, gpu->fast_rate);\n'
                   '\t\tpr_info("msm_devfreq: pinned core_clk to %u Hz (no ramp)\\n",\n'
                   '\t\t\tgpu->fast_rate);\n'
                   '\t}\n'
                   '\n'
                   '\tgpu->cooling = ')
          patch(p, old_s, new_s)

          # 3) resume: never resume the governor
          old_r = '\tdevfreq_resume_device(gpu->devfreq.devfreq);\n'
          new_r = ('\t/* BISECT-86: keeper suspended; clock pinned in init */\n'
                   '\t/* devfreq_resume_device(gpu->devfreq.devfreq); */\n')
          patch(p, old_r, new_r)
          PYEOF
          grep -n 'BISECT-86' drivers/gpu/drm/msm/msm_gpu_devfreq.c
          grep -n 'pinned core_clk' drivers/gpu/drm/msm/msm_gpu_devfreq.c
          grep -n 'devfreq_resume_device' drivers/gpu/drm/msm/msm_gpu_devfreq.c || echo "no-resume-device"

      - name: Patch a5xx per-process address space off (GPU SMMU cannot switch TTBR0)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import re
          p = "drivers/gpu/drm/msm/adreno/a5xx_gpu.c"
          s = open(p).read()
          pat = (r"static struct msm_gem_address_space \*\n"
                 r"a5xx_create_private_address_space\(struct msm_gpu \*gpu\)\n\{.*?\n\}\n")
          m = re.search(pat, s, re.S)
          assert m, "function not found"
          body = ('static struct msm_gem_address_space *\n'
                  'a5xx_create_private_address_space(struct msm_gpu *gpu)\n'
                  '{\n'
                  '\t/*\n'
                  '\t * Per-process (TTBR0) pagetables are not usable on this msm8998\n'
                  '\t * SMMU/firmware configuration: the CP faults at an unmapped iova\n'
                  '\t * as soon as a context is torn down (observed iova=0xb7000).\n'
                  '\t * Fall back to the single global GPU address space.\n'
                  '\t */\n'
                  '\treturn ERR_PTR(-ENODEV);\n'
                  '}\n')
          s = s[:m.start()] + body + s[m.end():]
          open(p, "w").write(s)
          print("per-process aspace disabled")
          PYEOF
          sed -n '/a5xx_create_private_address_space/,/^}/p' drivers/gpu/drm/msm/adreno/a5xx_gpu.c

      - name: Patch a5xx recovery (halt CP + power-cycle GPU before SW reset)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          p = "drivers/gpu/drm/msm/adreno/a5xx_gpu.c"
          s = open(p).read()
          old = "\tgpu_write(gpu, REG_A5XX_RBBM_SW_RESET_CMD, 1);\n"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old,
                        "\t/* BISECT: halt the micro engine, then power-cycle the GPU */\n"
                        "\tgpu_write(gpu, REG_A5XX_CP_PFP_ME_CNTL, 1);\n"
                        "\tpm_runtime_force_suspend(&gpu->pdev->dev);\n"
                        "\tpm_runtime_force_resume(&gpu->pdev->dev);\n\n" + old)
          if "#include <linux/pm_runtime.h>" not in s:
              s = s.replace('#include "a5xx_gpu.h"',
                            '#include <linux/pm_runtime.h>\n\n#include "a5xx_gpu.h"', 1)
          open(p, "w").write(s)
          print("a5xx recover halt+power-cycle patched")
          PYEOF
          grep -n -B4 'RBBM_SW_RESET_CMD, 1' drivers/gpu/drm/msm/adreno/a5xx_gpu.c | head -14

      - name: Patch arm-smmu runtime resume (GPU GX settle delay)
