name: build

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/degdag/W.I.P_sagit_mainline.git
  KERNEL_BRANCH: master
  ARCH: arm64
  CROSS: aarch64-linux-gnu-
  ROOTFS_BYTES: "56446922752"
  ROOTFS_URL: https://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
          nproc

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev \
            device-tree-compiler cpio xz-utils zstd curl \
            abootimg android-sdk-libsparse-utils qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64 || true
          command -v img2simg || echo "no img2simg, will use python fallback"

      - name: Clone kernel source
        run: |
          git clone --depth 1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          git log -1 --oneline
          ls arch/arm64/configs/ | grep -i sagit

      - name: Patch TFA9890 revision (Mi6 amp reports 0x88)
        run: |
          cd kernel
          sed -i 's/#define TFA9890_REVISION[[:space:]]*0x80/#define TFA9890_REVISION 0x88/' sound/soc/codecs/tfa989x.c
          grep -n 'TFA9890_REVISION' sound/soc/codecs/tfa989x.c | head

      - name: Patch GPU bring-up bisect gates (module param debug_stage bitmask)
        run: |
          cd kernel
          python3 "$GITHUB_WORKSPACE/scripts/patch_bisect.py" .
          grep -rn 'BISECT: bit' drivers/gpu/drm/msm/adreno/ | head -12 || true
          grep -n 'module_param_named(debug_stage' drivers/gpu/drm/msm/adreno/adreno_device.c || true

      - name: Patch DSI diagnostics (build-63 regression baseline)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          def patch(path, old, new):
              s = open(path).read()
              assert s.count(old) == 1, (path, s.count(old), old[:70])
              open(path, "w").write(s.replace(old, new, 1))
              print("patched", path)

          # 1) who computed what: pclk/bclk inputs to the PHY clock request
          patch("drivers/gpu/drm/msm/dsi/dsi_host.c",
                '\tDBG("pclk=%d, bclk=%d", msm_host->pixel_clk_rate,\n'
                '\t\t\t\tmsm_host->byte_clk_rate);\n',
                '\tDBG("pclk=%d, bclk=%d", msm_host->pixel_clk_rate,\n'
                '\t\t\t\tmsm_host->byte_clk_rate);\n'
                '\tpr_info("dsi_calc: pclk=%u bclk=%u lanes=%u bpp=%u bonded=%d mode_clock=%u\\n",\n'
                '\t\tmsm_host->pixel_clk_rate, msm_host->byte_clk_rate, lanes, bpp,\n'
                '\t\t(int)is_bonded_dsi, msm_host->mode ? msm_host->mode->clock : 0);\n')

          # 2) actual rates the clock framework/PHY really programmed
          patch("drivers/gpu/drm/msm/dsi/dsi_host.c",
                '\tret = cfg_hnd->ops->link_clk_set_rate(msm_host);\n'
                '\tif (!ret)\n'
                '\t\tret = cfg_hnd->ops->link_clk_enable(msm_host);\n',
                '\tret = cfg_hnd->ops->link_clk_set_rate(msm_host);\n'
                '\tif (!ret)\n'
                '\t\tret = cfg_hnd->ops->link_clk_enable(msm_host);\n'
                '\tif (!ret)\n'
                '\t\tpr_info("dsi_pwr: pclk=%u bclk=%u byte_clk=%lu pixel_clk=%lu src_clk=%lu\\n",\n'
                '\t\t\tmsm_host->pixel_clk_rate, msm_host->byte_clk_rate,\n'
                '\t\t\tclk_get_rate(msm_host->byte_clk),\n'
                '\t\t\tmsm_host->pixel_clk ? clk_get_rate(msm_host->pixel_clk) : 0UL,\n'
                '\t\t\tmsm_host->src_clk ? clk_get_rate(msm_host->src_clk) : 0UL);\n')

          # 3) DRM mode vs adjusted mode reaching the DSI bridge
          patch("drivers/gpu/drm/msm/dsi/dsi_manager.c",
                '\tDBG("set mode: " DRM_MODE_FMT, DRM_MODE_ARG(mode));\n',
                '\tDBG("set mode: " DRM_MODE_FMT, DRM_MODE_ARG(mode));\n'
                '\tpr_info("dsi_mgr_mode_set: clock=%u adjusted=%u htotal=%u vtotal=%u bonded=%d\\n",\n'
                '\t\tmode->clock, adjusted_mode->clock, adjusted_mode->htotal,\n'
                '\t\tadjusted_mode->vtotal, (int)is_bonded_dsi);\n')

          # 4) panel keeps upstream video-burst flags (regression baseline)
          # 5) on() sets LPM and never clears it; also dump panel state
          patch("drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c",
                '\tdsi_generic_write_seq(dsi, 0xb0, 0x03);\n'
                '\n'
                '\treturn 0;\n'
                '}\n'
                '\n'
                'static int jdi_fhd_r63452_off',
                '\tdsi_generic_write_seq(dsi, 0xb0, 0x03);\n'
                '\n'
                '\t{\n'
                '\t\tu8 val = 0;\n'
                '\t\tint rc;\n'
                '\n'
                '\t\tpr_info("panel: flags_in=0x%lx\\n", dsi->mode_flags);\n'
                '\t\trc = mipi_dsi_dcs_read(dsi, MIPI_DCS_GET_POWER_MODE, &val, 1);\n'
                '\t\tpr_info("panel: power_mode rc=%d val=0x%02x\\n", rc, val);\n'
                '\t\tval = 0;\n'
                '\t\trc = mipi_dsi_dcs_read(dsi, 0xda, &val, 1);\n'
                '\t\tpr_info("panel: id_da rc=%d val=0x%02x\\n", rc, val);\n'
                '\t\tval = 0;\n'
                '\t\trc = mipi_dsi_dcs_read(dsi, 0xdb, &val, 1);\n'
                '\t\tpr_info("panel: id_db rc=%d val=0x%02x\\n", rc, val);\n'
                '\t\tval = 0;\n'
                '\t\trc = mipi_dsi_dcs_read(dsi, MIPI_DCS_GET_DISPLAY_STATUS, &val, 1);\n'
                '\t\tpr_info("panel: display_status rc=%d val=0x%02x\\n", rc, val);\n'
                '\t\tval = 0;\n'
                '\t\trc = mipi_dsi_dcs_read(dsi, MIPI_DCS_READ_DDB_START, &val, 1);\n'
                '\t\tpr_info("panel: ddb_start rc=%d val=0x%02x\\n", rc, val);\n'
                '\t}\n'
                '\n'
                '\tdsi->mode_flags &= ~MIPI_DSI_MODE_LPM;\n'
                '\tpr_info("panel: flags_out=0x%lx\\n", dsi->mode_flags);\n'
                '\tpr_info("panel: on end t=%llu\\n", ktime_get_ns());\n'
                '\n'
                '\treturn 0;\n'
                '}\n'
                '\n'
                'static int jdi_fhd_r63452_off')
          # 6) per-command return values + stage timestamps
          patch("drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c",
                '\t\tret = mipi_dsi_generic_write(dsi, d, ARRAY_SIZE(d));\t\\\n'
                '\t\tif (ret < 0)\t\t\t\t\t\t\\\n',
                '\t\tret = mipi_dsi_generic_write(dsi, d, ARRAY_SIZE(d));\t\\\n'
                '\t\tpr_info("panel: gen %02x ret=%d\\n", d[0], ret);\t\\\n'
                '\t\tif (ret < 0)\t\t\t\t\t\t\\\n')
          patch("drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c",
                '\t\tret = mipi_dsi_dcs_write_buffer(dsi, d, ARRAY_SIZE(d));\t\\\n'
                '\t\tif (ret < 0)\t\t\t\t\t\t\\\n',
                '\t\tret = mipi_dsi_dcs_write_buffer(dsi, d, ARRAY_SIZE(d));\t\\\n'
                '\t\tpr_info("panel: dcs %02x ret=%d\\n", d[0], ret);\t\\\n'
                '\t\tif (ret < 0)\t\t\t\t\t\t\\\n')
          patch("drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c",
                '#include <linux/delay.h>\n',
                '#include <linux/delay.h>\n#include <linux/ktime.h>\n')
          patch("drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c",
                'static int jdi_fhd_r63452_prepare(struct drm_panel *panel)\n{\n',
                'static int jdi_fhd_r63452_prepare(struct drm_panel *panel)\n{\n'
                '\tpr_info("panel: prepare t=%llu\\n", ktime_get_ns());\n')
          patch("drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c",
                'static int jdi_fhd_r63452_on(struct jdi_fhd_r63452 *ctx)\n{\n\tstruct mipi_dsi_device *dsi = ctx->dsi;\n\tstruct device *dev = &dsi->dev;\n\tint ret;\n',
                'static int jdi_fhd_r63452_on(struct jdi_fhd_r63452 *ctx)\n{\n\tstruct mipi_dsi_device *dsi = ctx->dsi;\n\tstruct device *dev = &dsi->dev;\n\tint ret;\n\n\tpr_info("panel: on start t=%llu\\n", ktime_get_ns());\n')
          PYEOF
          grep -n 'dsi_calc: pclk' drivers/gpu/drm/msm/dsi/dsi_host.c
          grep -n 'dsi_pwr: pclk' drivers/gpu/drm/msm/dsi/dsi_host.c
          grep -n 'dsi_mgr_mode_set' drivers/gpu/drm/msm/dsi/dsi_manager.c
          grep -n -A4 'dsi->mode_flags = MIPI_DSI_MODE_VIDEO' drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c

      - name: Vendor DPHY timing override + TE irq counter (build-74)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          def patch(path, old, new):
              s = open(path).read()
              assert s.count(old) == 1, (path, s.count(old), old[:60])
              open(path, "w").write(s.replace(old, new, 1))
              print("patched", path)

          # 1) module switch + vendor t-clk-pre/post override
          patch("drivers/gpu/drm/msm/dsi/phy/dsi_phy.c",
                '#include "dsi_phy.h"\n\n#define S_DIV_ROUND_UP',
                '#include "dsi_phy.h"\n'
                '\n'
                '#include <linux/module.h>\n'
                '\n'
                '/*\n'
                ' * BISECT-73: vendor panel DTSI hardcodes t-clk-pre = 0x28 and\n'
                ' * t-clk-post = 0x07.  Force those two PHY timing fields instead of\n'
                ' * the values computed from the bit rate; set\n'
                ' * force_vendor_dphy_timing=0 to compare with the computed ones.\n'
                ' */\n'
                'static bool force_vendor_dphy_timing = true;\n'
                'module_param(force_vendor_dphy_timing, bool, 0644);\n'
                'MODULE_PARM_DESC(force_vendor_dphy_timing,\n'
                '\t\t "use vendor t-clk-pre/t-clk-post instead of computed values");\n'
                '\n'
                '#define S_DIV_ROUND_UP')

          pp = "drivers/gpu/drm/msm/dsi/phy/dsi_phy.c"
          t = open(pp).read()
          start = t.index("int msm_dsi_dphy_timing_calc_v3")
          idx = t.index("\ttiming->ta_go = 3;\n", start)
          override = ('\tif (force_vendor_dphy_timing) {\n'
                      '\t\tpr_info("dsi_phy: computed clk_pre=%d clk_post=%d -> vendor 0x28/0x07\\n",\n'
                      '\t\t\ttiming->shared_timings.clk_pre,\n'
                      '\t\t\ttiming->shared_timings.clk_post);\n'
                      '\t\ttiming->shared_timings.clk_pre = 0x28;\n'
                      '\t\ttiming->shared_timings.clk_post = 0x07;\n'
                      '\t\ttiming->shared_timings.clk_pre_inc_by_2 = 0;\n'
                      '\t\t/* vendor panel-timings = 00 1a 07 06 0a 11 07 07 05 03 04 00 */\n'
                      '\t\ttiming->hs_halfbyte_en = 0x00;\n'
                      '\t\ttiming->clk_zero = 0x1a;\n'
                      '\t\ttiming->clk_prepare = 0x07;\n'
                      '\t\ttiming->clk_trail = 0x06;\n'
                      '\t\ttiming->hs_exit = 0x0a;\n'
                      '\t\ttiming->hs_zero = 0x11;\n'
                      '\t\ttiming->hs_prepare = 0x07;\n'
                      '\t\ttiming->hs_trail = 0x07;\n'
                      '\t\ttiming->hs_rqst = 0x05;\n'
                      '\t}\n'
                      '\n')
          t = t[:idx] + override + t[idx:]
          open(pp, "w").write(t)
          print("vendor timing override inserted in v3")

          # 2) TE gpio irq counter so /proc/interrupts shows panel scanning
          patch("drivers/gpu/drm/msm/dsi/dsi_host.c",
                '\tstruct gpio_desc *disp_en_gpio;\n'
                '\tstruct gpio_desc *te_gpio;\n',
                '\tstruct gpio_desc *disp_en_gpio;\n'
                '\tstruct gpio_desc *te_gpio;\n'
                '\tint te_irq;\n'
                '\tatomic_t te_count;\n')

          patch("drivers/gpu/drm/msm/dsi/dsi_host.c",
                'static int dsi_host_init_panel_gpios(struct msm_dsi_host *msm_host,\n'
                '\t\t\tstruct device *panel_device)\n'
                '{\n',
                'static irqreturn_t dsi_te_irq_handler(int irq, void *data)\n'
                '{\n'
                '\tstruct msm_dsi_host *msm_host = data;\n'
                '\n'
                '\tatomic_inc(&msm_host->te_count);\n'
                '\treturn IRQ_HANDLED;\n'
                '}\n'
                '\n'
                'static int dsi_host_init_panel_gpios(struct msm_dsi_host *msm_host,\n'
                '\t\t\tstruct device *panel_device)\n'
                '{\n')

          patch("drivers/gpu/drm/msm/dsi/dsi_host.c",
                '\tif (IS_ERR(msm_host->te_gpio)) {\n'
                '\t\tDBG("cannot get disp-te-gpios %ld", PTR_ERR(msm_host->te_gpio));\n'
                '\t\treturn PTR_ERR(msm_host->te_gpio);\n'
                '\t}\n'
                '\n'
                '\treturn 0;\n'
                '}\n',
                '\tif (IS_ERR(msm_host->te_gpio)) {\n'
                '\t\tDBG("cannot get disp-te-gpios %ld", PTR_ERR(msm_host->te_gpio));\n'
                '\t\treturn PTR_ERR(msm_host->te_gpio);\n'
                '\t}\n'
                '\n'
                '\tif (msm_host->te_gpio) {\n'
                '\t\tmsm_host->te_irq = gpiod_to_irq(msm_host->te_gpio);\n'
                '\t\tif (msm_host->te_irq > 0) {\n'
                '\t\t\tif (devm_request_irq(&msm_host->pdev->dev,\n'
                '\t\t\t\t\t\t      msm_host->te_irq,\n'
                '\t\t\t\t\t\t      dsi_te_irq_handler,\n'
                '\t\t\t\t\t\t      IRQF_TRIGGER_RISING,\n'
                '\t\t\t\t\t\t      "dsi_te", msm_host))\n'
                '\t\t\t\tpr_err("dsi_te: cannot request irq %d\\n",\n'
                '\t\t\t\t       msm_host->te_irq);\n'
                '\t\t\telse\n'
                '\t\t\t\tpr_info("dsi_te: irq %d registered\\n",\n'
                '\t\t\t\t\tmsm_host->te_irq);\n'
                '\t\t} else {\n'
                '\t\t\tpr_info("dsi_te: gpio has no irq (%d)\\n", msm_host->te_irq);\n'
                '\t\t}\n'
                '\t}\n'
                '\n'
                '\treturn 0;\n'
                '}\n')
          PYEOF
          grep -n 'force_vendor_dphy_timing' drivers/gpu/drm/msm/dsi/phy/dsi_phy.c | head -5
          grep -n 'dsi_te' drivers/gpu/drm/msm/dsi/dsi_host.c | head -8

      - name: DCS test fill into panel GRAM (build-75, bypasses DPU)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          p = "drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c"
          s = open(p).read()

          i = s.index("#include")
          s = (s[:i] + "#include <linux/module.h>\n#include <linux/slab.h>\n" + s[i:])

          helper = (
              "static bool test_fill = true;\n"
              "module_param(test_fill, bool, 0644);\n"
              "MODULE_PARM_DESC(test_fill,\n"
              "\t\t \"DCS-fill a red band into panel GRAM (bypasses DPU)\");\n"
              "\n"
              "static void jdi_fhd_r63452_test_fill(struct mipi_dsi_device *dsi)\n"
              "{\n"
              "\tu8 col[] = { 0x00, 0x00, 0x04, 0x37 };\n"
              "\tu8 page[] = { 0x00, 0x00, 0x00, 0xff };\n"
              "\tu8 *buf;\n"
              "\tint i, rows, ret;\n"
              "\n"
              "\tbuf = kzalloc(1080 * 3, GFP_KERNEL);\n"
              "\tif (!buf)\n"
              "\t\treturn;\n"
              "\tfor (i = 0; i < 1080 * 3; i += 3) {\n"
              "\t\tbuf[i] = 0xff;\n"
              "\t\tbuf[i + 1] = 0x00;\n"
              "\t\tbuf[i + 2] = 0x00;\n"
              "\t}\n"
              "\n"
              "\tret = mipi_dsi_dcs_write(dsi, MIPI_DCS_SET_COLUMN_ADDRESS,\n"
              "\t\t\t\t col, sizeof(col));\n"
              "\tif (ret < 0) {\n"
              "\t\tpr_err(\"panel: test_fill column ret=%d\\n\", ret);\n"
              "\t\tgoto out;\n"
              "\t}\n"
              "\tret = mipi_dsi_dcs_write(dsi, MIPI_DCS_SET_PAGE_ADDRESS,\n"
              "\t\t\t\t page, sizeof(page));\n"
              "\tif (ret < 0) {\n"
              "\t\tpr_err(\"panel: test_fill page ret=%d\\n\", ret);\n"
              "\t\tgoto out;\n"
              "\t}\n"
              "\n"
              "\tfor (rows = 0; rows < 256; rows++) {\n"
              "\t\tret = mipi_dsi_dcs_write(dsi,\n"
              "\t\t\t\trows ? MIPI_DCS_WRITE_MEMORY_CONTINUE :\n"
              "\t\t\t\t       MIPI_DCS_WRITE_MEMORY_START,\n"
              "\t\t\t\tbuf, 1080 * 3);\n"
              "\t\tif (ret < 0) {\n"
              "\t\t\tpr_err(\"panel: test_fill row %d ret=%d\\n\", rows, ret);\n"
              "\t\t\tbreak;\n"
              "\t\t}\n"
              "\t}\n"
              "\tpr_info(\"panel: test_fill done rows=%d ret=%d\\n\", rows, ret);\n"
              "out:\n"
              "\tkfree(buf);\n"
              "}\n"
              "\n")

          anchor = "static int jdi_fhd_r63452_on(struct jdi_fhd_r63452 *ctx)\n"
          assert s.count(anchor) == 1, s.count(anchor)
          s = s.replace(anchor, helper + anchor, 1)

          i = s.index('pr_info("panel: flags_out=')
          j = s.index("\n", i) + 1
          s = s[:j] + "\tif (test_fill)\n\t\tjdi_fhd_r63452_test_fill(dsi);\n" + s[j:]
          open(p, "w").write(s)
          print("test_fill patched")
          PYEOF
          grep -n 'test_fill' drivers/gpu/drm/panel/panel-jdi-fhd-r63452.c | head -8

      - name: Patch a5xx per-process address space off (GPU SMMU cannot switch TTBR0)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import re
          p = "drivers/gpu/drm/msm/adreno/a5xx_gpu.c"
          s = open(p).read()
          pat = (r"static struct msm_gem_address_space \*\n"
                 r"a5xx_create_private_address_space\(struct msm_gpu \*gpu\)\n\{.*?\n\}\n")
          m = re.search(pat, s, re.S)
          assert m, "function not found"
          body = ('static struct msm_gem_address_space *\n'
                  'a5xx_create_private_address_space(struct msm_gpu *gpu)\n'
                  '{\n'
                  '\t/*\n'
                  '\t * Per-process (TTBR0) pagetables are not usable on this msm8998\n'
                  '\t * SMMU/firmware configuration: the CP faults at an unmapped iova\n'
                  '\t * as soon as a context is torn down (observed iova=0xb7000).\n'
                  '\t * Fall back to the single global GPU address space.\n'
                  '\t */\n'
                  '\treturn ERR_PTR(-ENODEV);\n'
                  '}\n')
          s = s[:m.start()] + body + s[m.end():]
          open(p, "w").write(s)
          print("per-process aspace disabled")
          PYEOF
          sed -n '/a5xx_create_private_address_space/,/^}/p' drivers/gpu/drm/msm/adreno/a5xx_gpu.c

      - name: Patch a5xx recovery (halt CP + power-cycle GPU before SW reset)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          p = "drivers/gpu/drm/msm/adreno/a5xx_gpu.c"
          s = open(p).read()
          old = "\tgpu_write(gpu, REG_A5XX_RBBM_SW_RESET_CMD, 1);\n"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old,
                        "\t/* BISECT: halt the micro engine, then power-cycle the GPU */\n"
                        "\tgpu_write(gpu, REG_A5XX_CP_PFP_ME_CNTL, 1);\n"
                        "\tpm_runtime_force_suspend(&gpu->pdev->dev);\n"
                        "\tpm_runtime_force_resume(&gpu->pdev->dev);\n\n" + old)
          if "#include <linux/pm_runtime.h>" not in s:
              s = s.replace('#include "a5xx_gpu.h"',
                            '#include <linux/pm_runtime.h>\n\n#include "a5xx_gpu.h"', 1)
          open(p, "w").write(s)
          print("a5xx recover halt+power-cycle patched")
          PYEOF
          grep -n -B4 'RBBM_SW_RESET_CMD, 1' drivers/gpu/drm/msm/adreno/a5xx_gpu.c | head -14

      - name: Patch arm-smmu runtime resume (GPU GX settle delay)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          p = "drivers/iommu/arm/arm-smmu/arm-smmu.c"
          s = open(p).read()
          old = "\tret = clk_bulk_enable(smmu->num_clks, smmu->clks);\n"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, "\t/* BISECT: let GPU GX domain settle before touching SMMU */\n\tmsleep(20);\n" + old)
          open(p, "w").write(s)
          print("smmu resume delay patched")
          PYEOF
          grep -n -B2 -A2 'BISECT: let GPU GX' drivers/iommu/arm/arm-smmu/arm-smmu.c

      - name: Patch GPU BIMC source clock ignore-unused (keep firmware state)
        run: |
          cd kernel
          python3 - <<'PYEOF'
          p = "drivers/clk/qcom/gcc-msm8998.c"
          s = open(p).read()
          old = '\t\t\t.name = "gcc_gpu_bimc_gfx_src_clk",\n'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, old + '\t\t\t.flags = CLK_IGNORE_UNUSED,\n')
          open(p, "w").write(s)
          print("gpu bimc src clock marked critical")
          PYEOF
          grep -n -A7 'gcc_gpu_bimc_gfx_src_clk = {' drivers/clk/qcom/gcc-msm8998.c

      - name: Patch sagit DT (add ramoops region)
        run: |
          cd kernel
          printf '\n/ {\n\tramoops@f7000000 {\n\t\tcompatible = "ramoops";\n\t\treg = <0x0 0xf7000000 0x0 0x40000>;\n\t\trecord-size = <0x10000>;\n\t\tconsole-size = <0x20000>;\n\t\tpmsg-size = <0x10000>;\n\t};\n};\n' >> arch/arm64/boot/dts/qcom/msm8998-xiaomi-sagit.dts
          tail -14 arch/arm64/boot/dts/qcom/msm8998-xiaomi-sagit.dts

      - name: Configure kernel
        run: |
          cd kernel
          make ARCH=$ARCH CROSS_COMPILE=$CROSS sagit_defconfig
          set +e
          scripts/config --file .config \
            -e DEVTMPFS -e DEVTMPFS_MOUNT -e DEVMEM -d STRICT_DEVMEM -d IO_STRICT_DEVMEM \
            -e DRM -m DRM_MSM -e DRM_FBDEV_EMULATION -e DRM_PANEL_JDI_FHD_R63452 \
            -e FB -e FRAMEBUFFER_CONSOLE -e VT -e VT_CONSOLE \
            -e RMI4_CORE -e RMI4_I2C \
            -e I2C_QCOM_GENI -e INPUT_EVDEV \
            -e BACKLIGHT_QCOM_WLED -e LEDS_CLASS \
            -e SCSI_UFS_QCOM -e SCSI_UFSHCD -e SCSI_UFSHCD_PLTFRM \
            -e EFI_PARTITION -e EXT4_FS \
            -e SERIAL_QCOM_GENI -e SERIAL_QCOM_GENI_CONSOLE -e QCOM_GENI_SE \
            -e USB_GADGET -e USB_CONFIGFS -e USB_F_RNDIS \
            -e I2C_QUP -e RTC_DRV_PM8XXX -e RTC_HCTOSYS -e BATTERY_QCOM_FG \
            -m SND_SOC_TFA989X \
            -e PSTORE -e PSTORE_RAM -e PSTORE_CONSOLE -e PSTORE_PMSG \
            -e ANDROID_BINDERFS -e MODULES
          set -e
          make ARCH=$ARCH CROSS_COMPILE=$CROSS olddefconfig
          echo "=== key symbols ==="
          for s in CONFIG_DRM_MSM CONFIG_DEVMEM CONFIG_DRM_PANEL_JDI_FHD_R63452 CONFIG_DRM_FBDEV_EMULATION \
                   CONFIG_BACKLIGHT_QCOM_WLED CONFIG_I2C_QCOM_GENI CONFIG_I2C_QUP CONFIG_INPUT_EVDEV \
                   CONFIG_FRAMEBUFFER_CONSOLE CONFIG_RMI4_CORE CONFIG_RMI4_I2C \
                   CONFIG_RTC_DRV_PM8XXX CONFIG_RTC_HCTOSYS CONFIG_BATTERY_QCOM_FG \
                   CONFIG_SND_SOC_TFA989X CONFIG_EXTRA_FIRMWARE CONFIG_FW_LOADER CONFIG_CMDLINE \
                   CONFIG_PSTORE CONFIG_PSTORE_RAM \
                   CONFIG_SCSI_UFS_QCOM CONFIG_EFI_PARTITION CONFIG_EXT4_FS \
                   CONFIG_DEVTMPFS_MOUNT CONFIG_SERIAL_QCOM_GENI CONFIG_USB_CONFIGFS \
                   CONFIG_ANDROID_BINDERFS CONFIG_MODULES; do
            printf '%-42s %s\n' "$s" "$(grep -E "^$s=" .config || echo MISSING)"
          done

      - name: Build kernel
        run: |
          cd kernel
          make ARCH=$ARCH CROSS_COMPILE=$CROSS -j"$(nproc)" Image.gz dtbs modules
          ls -l arch/arm64/boot/Image.gz
          ls -l arch/arm64/boot/dts/qcom/msm8998-xiaomi-sagit.dtb

      - name: Assemble Image.gz-dtb and modules
        run: |
          set -eux
          cd kernel
          cat arch/arm64/boot/Image.gz arch/arm64/boot/dts/qcom/msm8998-xiaomi-sagit.dtb > Image.gz-dtb
          make -s ARCH=$ARCH CROSS_COMPILE=$CROSS kernelrelease > /tmp/krel.txt
          cat /tmp/krel.txt
          rm -rf modroot
          make ARCH=$ARCH CROSS_COMPILE=$CROSS INSTALL_MOD_PATH="$PWD/modroot" INSTALL_MOD_STRIP=1 modules_install
          tar -czf /tmp/modules.tar.gz -C modroot lib/modules
          ls -lh Image.gz-dtb /tmp/modules.tar.gz

      - name: Build initramfs
        run: |
          set -eux
          cd /tmp
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/aarch64/ -o alindex.html
          PKG=$(grep -oE 'busybox-static-[0-9]+[^"<]*\.apk' alindex.html | head -1)
          echo "busybox pkg: $PKG"
          curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/aarch64/$PKG" -o bb.apk
          mkdir -p bb
          tar -xzf bb.apk -C bb || true
          BB=$(find bb -type f -name 'busybox*' | head -1)
          file "$BB"
          mkdir -p initramfs/bin initramfs/dev initramfs/proc initramfs/sys initramfs/etc initramfs/tmp initramfs/newroot
          cp "$BB" initramfs/bin/busybox
          chmod +x initramfs/bin/busybox
          for a in sh mount umount blkid sleep switch_root mkdir cat ls echo dmesg mdev \
                   reboot poweroff insmod modprobe ifconfig ip find grep \
                   head ln chmod sed printf mountpoint; do
            ln -sf /bin/busybox initramfs/bin/$a
          done
          cat > initramfs/init <<'INITEOF'
          #!/bin/sh
          export PATH=/bin
          mount -t devtmpfs devtmpfs /dev 2>/dev/null
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          find_root() {
            for d in /dev/sd*[0-9]; do
              [ -b "$d" ] || continue
              mount -t ext4 -o ro "$d" /newroot 2>/dev/null || continue
              if [ -f /newroot/etc/hostname ] && grep -q sagit /newroot/etc/hostname 2>/dev/null; then
                umount /newroot
                echo "$d"
                return 0
              fi
              umount /newroot
            done
            return 1
          }
          i=0
          R=""
          while [ $i -lt 180 ]; do
            R=$(find_root)
            [ -n "$R" ] && break
            i=$((i+1))
            sleep 1
          done
          echo "root device: ${R:-none}"
          [ -z "$R" ] && R=/dev/sda17
          mount -t ext4 -o rw,noatime "$R" /newroot || {
            echo "root mount failed"
            sleep 3
            echo b > /proc/sysrq-trigger 2>/dev/null
            sleep 3
            reboot -f 2>/dev/null
            exec sh
          }

          cat > /newroot/usr/local/bin/usb-gadget.sh <<'GADGETEOF'
          #!/bin/sh
          set -e
          mountpoint -q /sys/kernel/config || mount -t configfs none /sys/kernel/config
          G=/sys/kernel/config/usb_gadget/g1
          [ -s "$G/UDC" ] && exit 0
          mkdir -p "$G"
          echo 0x1d6b > "$G/idVendor"
          echo 0x0105 > "$G/idProduct"
          mkdir -p "$G/strings/0x409"
          echo sagit-archlinux > "$G/strings/0x409/serialnumber"
          echo Xiaomi > "$G/strings/0x409/manufacturer"
          echo Mi6-Arch > "$G/strings/0x409/product"
          mkdir -p "$G/configs/c.1/strings/0x409"
          echo rndis > "$G/configs/c.1/strings/0x409/configuration"
          mkdir -p "$G/functions/rndis.usb0"
          ln -sf "$G/functions/rndis.usb0" "$G/configs/c.1/rndis.usb0"
          echo 0xEF > "$G/bDeviceClass"
          echo 0x02 > "$G/bDeviceSubClass"
          echo 0x01 > "$G/bDeviceProtocol"
          echo 1 > "$G/os_desc/use"
          echo 0xcd > "$G/os_desc/b_vendor_code"
          echo MSFT100 > "$G/os_desc/qw_sign"
          mkdir -p "$G/functions/rndis.usb0/os_desc/interface.rndis"
          echo RNDIS > "$G/functions/rndis.usb0/os_desc/interface.rndis/compatible_id"
          echo 5162001 > "$G/functions/rndis.usb0/os_desc/interface.rndis/sub_compatible_id"
          ln -sf "$G/configs/c.1" "$G/os_desc/c.1"
          UDC=$(ls /sys/class/udc | grep . | head -1)
          [ -n "$UDC" ] && echo "$UDC" > "$G/UDC"
          GADGETEOF
          chmod +x /newroot/usr/local/bin/usb-gadget.sh

          mkdir -p /newroot/etc/systemd/system/multi-user.target.wants
          ln -sf /etc/systemd/system/usb-gadget.service /newroot/etc/systemd/system/multi-user.target.wants/usb-gadget.service

          CFG=/newroot/etc/ssh/sshd_config
          sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' "$CFG" 2>/dev/null
          grep -q '^PermitRootLogin' "$CFG" 2>/dev/null || echo 'PermitRootLogin yes' >> "$CFG"
          sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' "$CFG" 2>/dev/null
          grep -q '^PasswordAuthentication' "$CFG" 2>/dev/null || echo 'PasswordAuthentication yes' >> "$CFG"
          mkdir -p /newroot/etc/ssh/sshd_config.d
          printf 'PermitRootLogin yes\nPasswordAuthentication yes\n' > /newroot/etc/ssh/sshd_config.d/99-root.conf
          chmod 644 /newroot/etc/ssh/sshd_config.d/99-root.conf

          mkdir -p /sys/kernel/config
          mount -t configfs none /sys/kernel/config 2>/dev/null
          G=/sys/kernel/config/usb_gadget/g1
          mkdir -p "$G"
          echo 0x1d6b > "$G/idVendor"
          echo 0x0105 > "$G/idProduct"
          mkdir -p "$G/strings/0x409"
          echo sagit-archlinux > "$G/strings/0x409/serialnumber"
          echo Xiaomi > "$G/strings/0x409/manufacturer"
          echo Mi6-Arch > "$G/strings/0x409/product"
          mkdir -p "$G/configs/c.1/strings/0x409"
          echo rndis > "$G/configs/c.1/strings/0x409/configuration"
          mkdir -p "$G/functions/rndis.usb0"
          ln -sf "$G/functions/rndis.usb0" "$G/configs/c.1/rndis.usb0"
          echo 0xEF > "$G/bDeviceClass"
          echo 0x02 > "$G/bDeviceSubClass"
          echo 0x01 > "$G/bDeviceProtocol"
          echo 1 > "$G/os_desc/use"
          echo 0xcd > "$G/os_desc/b_vendor_code"
          echo MSFT100 > "$G/os_desc/qw_sign"
          mkdir -p "$G/functions/rndis.usb0/os_desc/interface.rndis"
          echo RNDIS > "$G/functions/rndis.usb0/os_desc/interface.rndis/compatible_id"
          echo 5162001 > "$G/functions/rndis.usb0/os_desc/interface.rndis/sub_compatible_id"
          ln -sf "$G/configs/c.1" "$G/os_desc/c.1"
          UDC=$(ls /sys/class/udc | grep . | head -1)
          [ -n "$UDC" ] && echo "$UDC" > "$G/UDC"

          i=0
          while [ ! -e /sys/class/net/usb0 ] && [ $i -lt 20 ]; do
            i=$((i+1))
            sleep 1
          done
          ifconfig usb0 192.168.42.1 netmask 255.255.255.0 up 2>/dev/null

          mount --move /dev /newroot/dev
          mount --move /proc /newroot/proc
          mount --move /sys /newroot/sys
          mkdir -p /newroot/dev/pts /newroot/dev/shm /newroot/run /newroot/sys/fs/cgroup
          mount -t devpts devpts /newroot/dev/pts 2>/dev/null
          mount -t tmpfs -o mode=1777,nosuid,nodev shm /newroot/dev/shm 2>/dev/null
          mount -t tmpfs -o mode=0755,nosuid,nodev run /newroot/run 2>/dev/null
          mount -t cgroup2 none /newroot/sys/fs/cgroup 2>/dev/null
          exec switch_root /newroot /sbin/init
          INITEOF
          chmod +x initramfs/init
          cd initramfs
          find . | cpio -o -H newc 2>/dev/null | gzip -9 > /tmp/initramfs.gz
          ls -lh /tmp/initramfs.gz

      - name: Package boot.img
        run: |
          set -eux
          cd kernel
          cat > /tmp/bootimg.cfg <<'CFGEOF'
          bootsize = 67108864
          pagesize = 4096
          kerneladdr = 0x00008000
          ramdiskaddr = 0x01000000
          secondaddr = 0x00F00000
          tagsaddr = 0x00000100
          name = sagit-archlinux
          cmdline = console=ttyMSM0,115200n8 root=/dev/sda17 rw rootwait rootfstype=ext4 earlycon panic=30
          CFGEOF
          abootimg --create /tmp/boot.img -f /tmp/bootimg.cfg -k Image.gz-dtb -r /tmp/initramfs.gz
          abootimg -i /tmp/boot.img
          ls -lh /tmp/boot.img
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp /tmp/boot.img /tmp/modules.tar.gz "$GITHUB_WORKSPACE/out/"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/
          retention-days: 30

      - name: Cache arch tarball
        uses: actions/cache@v4
        with:
          path: /tmp/arch.tar.gz
          key: archlinuxarm-aarch64-latest-20261103

      - name: Download Arch rootfs tarball
        run: |
          set -eux
          if [ -s /tmp/arch.tar.gz ] && [ "$(stat -c%s /tmp/arch.tar.gz)" -gt 700000000 ]; then
            echo "cached tarball, skip download"
            tar -tzf /tmp/arch.tar.gz | head -3
            exit 0
          fi
          url=""
          for u in \
            http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz \
            https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/os/ArchLinuxARM-aarch64-latest.tar.gz \
            http://mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz; do
            echo "trying $u"
            if curl -fSL --retry 2 --connect-timeout 20 --max-time 1800 -o /tmp/arch.tar.gz "$u"; then
              url="$u"; break
            fi
          done
          test -n "$url"
          echo "downloaded from $url"
          ls -lh /tmp/arch.tar.gz
          tar -tzf /tmp/arch.tar.gz | head -3

      - name: Build ext4 rootfs image
        run: |
          set -eux
          truncate -s "$ROOTFS_BYTES" /tmp/rootfs.img
          sudo mkfs.ext4 -F -L archroot -m 0 /tmp/rootfs.img
          sudo mkdir -p /mnt/root
          sudo mount -o loop /tmp/rootfs.img /mnt/root
          sudo tar -xzf /tmp/arch.tar.gz -C /mnt/root --numeric-owner
          sudo cp /usr/bin/qemu-aarch64-static /mnt/root/usr/bin/
          sudo mount --bind /proc /mnt/root/proc
          sudo mount --bind /sys /mnt/root/sys
          sudo mount --bind /dev /mnt/root/dev
          sudo mkdir -p /mnt/root/dev/pts
          sudo mount --bind /dev/pts /mnt/root/dev/pts
          echo "host resolv.conf:"; cat /etc/resolv.conf
          sudo sh -c 'printf "nameserver 168.63.129.16\nnameserver 8.8.8.8\nnameserver 1.1.1.1\n" > /mnt/root/etc/resolv.conf'
          for h in mirror.archlinuxarm.org mirrors.tuna.tsinghua.edu.cn; do
            for ip in $(getent ahostsv4 "$h" | awk '{print $1}' | sort -u | head -4); do
              echo "$ip $h"
            done | sudo tee -a /mnt/root/etc/hosts
          done
          echo "chroot hosts:"; sudo tail -12 /mnt/root/etc/hosts
          EFF=$(curl -sSL -o /dev/null -w '%{url_effective}' http://mirror.archlinuxarm.org/archlinuxarm/aarch64/core/core.db)
          MHOST=$(echo "$EFF" | sed -E 's#^http://([^/]+).*#\1#')
          echo "effective mirror host: $MHOST"
          for ip in $(getent ahostsv4 "$MHOST" | awk '{print $1}' | sort -u); do
            echo "$ip $MHOST"
          done | sudo tee -a /mnt/root/etc/hosts
          sudo bash -c "cat > /mnt/root/etc/pacman.d/mirrorlist <<'EOF'
          Server = http://$MHOST/\$arch/\$repo
          EOF"
          sudo cat /mnt/root/etc/pacman.d/mirrorlist
          ls /mnt/root

      - name: Install packages in rootfs
        run: |
          set -eux
          cat > /tmp/setup.sh <<'SETUPEOF'
          #!/bin/bash
          set -eux
          echo "resolve check:"
          cat /etc/pacman.d/mirrorlist
          if pacman --disable-sandbox -V >/dev/null 2>&1; then
            PM="pacman --disable-sandbox"
          else
            PM="pacman"
          fi
          pacman-key --init
          pacman-key --populate archlinuxarm
          $PM -Sy --noconfirm
          $PM -S --noconfirm --needed \
            openssh networkmanager wpa_supplicant iw dnsmasq \
            linux-firmware-qcom wireless-regdb \
            sudo vim nano htop git mesa
          $PM -S --noconfirm --needed weston seatd || echo "optional packages skipped"
          rm -rf /var/cache/pacman/pkg/*
          if [ -d /usr/lib/firmware ]; then
            find /usr/lib/firmware -mindepth 1 -maxdepth 1 \
              ! -name ath10k ! -name qcom ! -name 'regulatory.db' ! -name 'regulatory.db.p7s' \
              -exec rm -rf {} +
          fi
          echo "rootfs size:"; du -sh /usr /var 2>/dev/null || true
          mkdir -p /etc/systemd/system/multi-user.target.wants
          ln -sf /usr/lib/systemd/system/sshd.service /etc/systemd/system/multi-user.target.wants/sshd.service
          ln -sf /usr/lib/systemd/system/NetworkManager.service /etc/systemd/system/multi-user.target.wants/NetworkManager.service
          printf "root:root\n" | chpasswd
          echo "LABEL=archroot / ext4 defaults,noatime 0 1" > /etc/fstab
          echo sagit-archlinux > /etc/hostname

          mkdir -p /etc/ssh/sshd_config.d
          printf 'PermitRootLogin yes\nPasswordAuthentication yes\n' > /etc/ssh/sshd_config.d/99-root.conf
          chmod 644 /etc/ssh/sshd_config.d/99-root.conf

          mkdir -p /etc/NetworkManager/conf.d
          cat > /etc/NetworkManager/conf.d/99-usb0-unmanaged.conf <<'NMEOF'
          [keyfile]
          unmanaged-devices=interface-name:usb0
          NMEOF

          cat > /usr/local/bin/usb-gadget.sh <<'GADGETEOF'
          #!/bin/sh
          set -e
          mountpoint -q /sys/kernel/config || mount -t configfs none /sys/kernel/config
          G=/sys/kernel/config/usb_gadget/g1
          [ -s "$G/UDC" ] && exit 0
          mkdir -p "$G"
          echo 0x1d6b > "$G/idVendor"
          echo 0x0105 > "$G/idProduct"
          mkdir -p "$G/strings/0x409"
          echo sagit-archlinux > "$G/strings/0x409/serialnumber"
          echo Xiaomi > "$G/strings/0x409/manufacturer"
          echo Mi6-Arch > "$G/strings/0x409/product"
          mkdir -p "$G/configs/c.1/strings/0x409"
          echo rndis > "$G/configs/c.1/strings/0x409/configuration"
          mkdir -p "$G/functions/rndis.usb0"
          ln -sf "$G/functions/rndis.usb0" "$G/configs/c.1/rndis.usb0"
          echo 0xEF > "$G/bDeviceClass"
          echo 0x02 > "$G/bDeviceSubClass"
          echo 0x01 > "$G/bDeviceProtocol"
          echo 1 > "$G/os_desc/use"
          echo 0xcd > "$G/os_desc/b_vendor_code"
          echo MSFT100 > "$G/os_desc/qw_sign"
          mkdir -p "$G/functions/rndis.usb0/os_desc/interface.rndis"
          echo RNDIS > "$G/functions/rndis.usb0/os_desc/interface.rndis/compatible_id"
          echo 5162001 > "$G/functions/rndis.usb0/os_desc/interface.rndis/sub_compatible_id"
          ln -sf "$G/configs/c.1" "$G/os_desc/c.1"
          UDC=$(ls /sys/class/udc | grep . | head -1)
          [ -n "$UDC" ] && echo "$UDC" > "$G/UDC"
          GADGETEOF
          chmod +x /usr/local/bin/usb-gadget.sh

          cat > /etc/systemd/system/usb-gadget.service <<'UNITEOF'
          [Unit]
          Description=USB RNDIS gadget fallback
          After=local-fs.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/bin/usb-gadget.sh

          [Install]
          WantedBy=multi-user.target
          UNITEOF
          ln -sf /etc/systemd/system/usb-gadget.service /etc/systemd/system/multi-user.target.wants/usb-gadget.service

          cat > /usr/local/bin/usb0-net.sh <<'USB0EOF'
          #!/bin/sh
          set -u
          i=0
          while [ ! -e /sys/class/net/usb0 ] && [ "$i" -lt 30 ]; do
              sleep 1
              i=$((i + 1))
          done
          [ -e /sys/class/net/usb0 ] || exit 0

          ip link set usb0 up 2>/dev/null || true
          ip addr replace 192.168.42.1/24 dev usb0 2>/dev/null || true

          exec dnsmasq \
              --keep-in-foreground \
              --port=0 \
              --interface=usb0 \
              --bind-interfaces \
              --dhcp-range=192.168.42.2,192.168.42.20,255.255.255.0,12h \
              --dhcp-option=3,192.168.42.1 \
              --dhcp-option=6,192.168.42.1 \
              --dhcp-authoritative \
              --no-hosts \
              --no-resolv \
              --leasefile-ro \
              --pid-file=/run/usb0-dnsmasq.pid \
              --log-facility=/var/log/usb0-dnsmasq.log
          USB0EOF
          chmod +x /usr/local/bin/usb0-net.sh

          cat > /etc/systemd/system/usb0-net.service <<'UNITEOF2'
          [Unit]
          Description=usb0 static IP + DHCP for USB gadget SSH
          After=multi-user.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/usb0-net.sh
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNITEOF2
          ln -sf /etc/systemd/system/usb0-net.service /etc/systemd/system/multi-user.target.wants/usb0-net.service
          SETUPEOF
          sudo cp /tmp/setup.sh /mnt/root/setup.sh
          sudo chmod +x /mnt/root/setup.sh
          sudo chroot /mnt/root /setup.sh

      - name: Copy kernel modules into rootfs
        run: |
          set -eux
          sudo tar -xzf /tmp/modules.tar.gz -C /mnt/root/
          sudo find /mnt/root/lib/modules -name '*.ko.xz' -exec xz -d {} \;
          sudo chroot /mnt/root /bin/bash -c 'DEP=$(ls /lib/modules | head -1); echo "modules: $DEP"; depmod -a "$DEP" || true'

      - name: Unmount rootfs
        run: |
          set -eux
          sudo fuser -vm /mnt/root || true
          sudo umount -R /mnt/root || sudo umount -Rl /mnt/root || true
          mount | grep /mnt/root || true
          for d in $(losetup -j /tmp/rootfs.img | cut -d: -f1); do sudo losetup -d "$d" || true; done
          sudo e2fsck -f -y /tmp/rootfs.img || true
          ls -lh /tmp/rootfs.img
          du -h /tmp/rootfs.img

      - name: Convert to sparse image
        run: |
          set -eux
          if command -v img2simg >/dev/null 2>&1; then
            img2simg /tmp/rootfs.img /tmp/rootfs.simg || python3 scripts/mk_sparse.py /tmp/rootfs.img /tmp/rootfs.simg
          else
            python3 scripts/mk_sparse.py /tmp/rootfs.img /tmp/rootfs.simg
          fi
          ls -lh /tmp/rootfs.simg
          sha256sum /tmp/rootfs.simg /tmp/boot.img
          mkdir -p "$GITHUB_WORKSPACE/out"
          rm -f "$GITHUB_WORKSPACE"/out/rootfs.simg.part*
          split -b 1900M -d -a 2 /tmp/rootfs.simg "$GITHUB_WORKSPACE/out/rootfs.simg.part"
          ls -lh "$GITHUB_WORKSPACE/out"
          sha256sum "$GITHUB_WORKSPACE"/out/rootfs.simg.part*

      - name: Create release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" \
            out/boot.img out/rootfs.simg.part* out/modules.tar.gz \
            --title "sagit archlinux $TAG" \
            --notes "kernel: $(cat /tmp/krel.txt)
            fixes: touch(I2C_QUP builtin + RMI4), RTC(pm8xxx), battery(qcom_fg), GPU fw(a530), regulatory.db,
            initramfs USB gadget+sshd drop-in, usb0 static IP+DHCP, gadget fallback service
            known: WiFi needs WCNSS/QMI endpoint, audio needs ADSP firmware (both absent from this tree/fw)
            合并分片后刷入: cat rootfs.simg.part* > rootfs.simg (Windows: copy /b rootfs.simg.part00+rootfs.simg.part01 rootfs.simg)" \
            --repo "${{ github.repository }}"
