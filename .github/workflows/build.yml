name: build

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/degdag/W.I.P_sagit_mainline.git
  KERNEL_BRANCH: master
  ARCH: arm64
  CROSS: aarch64-linux-gnu-
  ROOTFS_BYTES: "56446922752"
  ROOTFS_URL: https://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
          nproc

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev \
            device-tree-compiler cpio xz-utils zstd curl \
            abootimg android-sdk-libsparse-utils qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64 || true
          command -v img2simg || echo "no img2simg, will use python fallback"

      - name: Clone kernel source
        run: |
          git clone --depth 1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          git log -1 --oneline
          ls arch/arm64/configs/ | grep -i sagit

      - name: Patch TFA9890 revision (Mi6 amp reports 0x88)
        run: |
          cd kernel
          sed -i 's/#define TFA9890_REVISION[[:space:]]*0x80/#define TFA9890_REVISION 0x88/' sound/soc/codecs/tfa989x.c
          grep -n 'TFA9890_REVISION' sound/soc/codecs/tfa989x.c | head

      - name: Patch GCC GPU clock halt checks (match mainline BRANCH_HALT_SKIP)
        run: |
          python3 scripts/patch_gcc.py kernel
          grep -n 'BRANCH_HALT_SKIP' kernel/drivers/clk/qcom/gcc-msm8998.c | head

      - name: Patch sagit DT (vote VDDCX for GPUCC, add zap-shader node)
        run: |
          cd kernel
          printf '\n&gpucc {\n\tpower-domains = <&rpmpd MSM8998_VDDCX>;\n};\n\n&adreno_gpu {\n\tzap-shader {\n\t\tmemory-region = <&zap_shader_region>;\n\t};\n};\n' >> arch/arm64/boot/dts/qcom/msm8998-xiaomi-sagit.dts
          tail -14 arch/arm64/boot/dts/qcom/msm8998-xiaomi-sagit.dts

      - name: Configure kernel
        run: |
          cd kernel
          make ARCH=$ARCH CROSS_COMPILE=$CROSS sagit_defconfig
          set +e
          scripts/config --file .config \
            -e DEVTMPFS -e DEVTMPFS_MOUNT \
            -e DRM -m DRM_MSM -e DRM_FBDEV_EMULATION -e DRM_PANEL_JDI_FHD_R63452 \
            -e FB -e FRAMEBUFFER_CONSOLE -e VT -e VT_CONSOLE \
            -e RMI4_CORE -e RMI4_I2C \
            -e I2C_QCOM_GENI -e INPUT_EVDEV \
            -e BACKLIGHT_QCOM_WLED -e LEDS_CLASS \
            -e SCSI_UFS_QCOM -e SCSI_UFSHCD -e SCSI_UFSHCD_PLTFRM \
            -e EFI_PARTITION -e EXT4_FS \
            -e SERIAL_QCOM_GENI -e SERIAL_QCOM_GENI_CONSOLE -e QCOM_GENI_SE \
            -e USB_GADGET -e USB_CONFIGFS -e USB_F_RNDIS \
            -e I2C_QUP -e RTC_DRV_PM8XXX -e RTC_HCTOSYS -e BATTERY_QCOM_FG \
            -m SND_SOC_TFA989X \
            -e ANDROID_BINDERFS -e MODULES
          set -e
          make ARCH=$ARCH CROSS_COMPILE=$CROSS olddefconfig
          echo "=== key symbols ==="
          for s in CONFIG_DRM_MSM CONFIG_DRM_PANEL_JDI_FHD_R63452 CONFIG_DRM_FBDEV_EMULATION \
                   CONFIG_BACKLIGHT_QCOM_WLED CONFIG_I2C_QCOM_GENI CONFIG_I2C_QUP CONFIG_INPUT_EVDEV \
                   CONFIG_FRAMEBUFFER_CONSOLE CONFIG_RMI4_CORE CONFIG_RMI4_I2C \
                   CONFIG_RTC_DRV_PM8XXX CONFIG_RTC_HCTOSYS CONFIG_BATTERY_QCOM_FG \
                   CONFIG_SND_SOC_TFA989X CONFIG_EXTRA_FIRMWARE CONFIG_FW_LOADER CONFIG_CMDLINE \
                   CONFIG_SCSI_UFS_QCOM CONFIG_EFI_PARTITION CONFIG_EXT4_FS \
                   CONFIG_DEVTMPFS_MOUNT CONFIG_SERIAL_QCOM_GENI CONFIG_USB_CONFIGFS \
                   CONFIG_ANDROID_BINDERFS CONFIG_MODULES; do
            printf '%-42s %s\n' "$s" "$(grep -E "^$s=" .config || echo MISSING)"
          done

      - name: Build kernel
        run: |
          cd kernel
          make ARCH=$ARCH CROSS_COMPILE=$CROSS -j"$(nproc)" Image.gz dtbs modules
          ls -l arch/arm64/boot/Image.gz
          ls -l arch/arm64/boot/dts/qcom/msm8998-xiaomi-sagit.dtb

      - name: Assemble Image.gz-dtb and modules
        run: |
          set -eux
          cd kernel
          cat arch/arm64/boot/Image.gz arch/arm64/boot/dts/qcom/msm8998-xiaomi-sagit.dtb > Image.gz-dtb
          make -s ARCH=$ARCH CROSS_COMPILE=$CROSS kernelrelease > /tmp/krel.txt
          cat /tmp/krel.txt
          rm -rf modroot
          make ARCH=$ARCH CROSS_COMPILE=$CROSS INSTALL_MOD_PATH="$PWD/modroot" INSTALL_MOD_STRIP=1 modules_install
          tar -czf /tmp/modules.tar.gz -C modroot lib/modules
          ls -lh Image.gz-dtb /tmp/modules.tar.gz

      - name: Build initramfs
        run: |
          set -eux
          cd /tmp
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/aarch64/ -o alindex.html
          PKG=$(grep -oE 'busybox-static-[0-9]+[^"<]*\.apk' alindex.html | head -1)
          echo "busybox pkg: $PKG"
          curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/aarch64/$PKG" -o bb.apk
          mkdir -p bb
          tar -xzf bb.apk -C bb || true
          BB=$(find bb -type f -name 'busybox*' | head -1)
          file "$BB"
          mkdir -p initramfs/bin initramfs/dev initramfs/proc initramfs/sys initramfs/etc initramfs/tmp initramfs/newroot
          cp "$BB" initramfs/bin/busybox
          chmod +x initramfs/bin/busybox
          for a in sh mount umount blkid sleep switch_root mkdir cat ls echo dmesg mdev \
                   reboot poweroff insmod modprobe ifconfig ip find grep \
                   head ln chmod sed printf mountpoint; do
            ln -sf /bin/busybox initramfs/bin/$a
          done
          cat > initramfs/init <<'INITEOF'
          #!/bin/sh
          export PATH=/bin
          mount -t devtmpfs devtmpfs /dev 2>/dev/null
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          find_root() {
            for d in /dev/sd*[0-9]; do
              [ -b "$d" ] || continue
              mount -t ext4 -o ro "$d" /newroot 2>/dev/null || continue
              if [ -f /newroot/etc/hostname ] && grep -q sagit /newroot/etc/hostname 2>/dev/null; then
                umount /newroot
                echo "$d"
                return 0
              fi
              umount /newroot
            done
            return 1
          }
          i=0
          R=""
          while [ $i -lt 60 ]; do
            R=$(find_root)
            [ -n "$R" ] && break
            i=$((i+1))
            sleep 1
          done
          echo "root device: ${R:-none}"
          [ -z "$R" ] && R=/dev/sda17
          mount -t ext4 -o rw,noatime "$R" /newroot || { echo "root mount failed"; exec sh; }

          cat > /newroot/usr/local/bin/usb-gadget.sh <<'GADGETEOF'
          #!/bin/sh
          set -e
          mountpoint -q /sys/kernel/config || mount -t configfs none /sys/kernel/config
          G=/sys/kernel/config/usb_gadget/g1
          [ -s "$G/UDC" ] && exit 0
          mkdir -p "$G"
          echo 0x1d6b > "$G/idVendor"
          echo 0x0105 > "$G/idProduct"
          mkdir -p "$G/strings/0x409"
          echo sagit-archlinux > "$G/strings/0x409/serialnumber"
          echo Xiaomi > "$G/strings/0x409/manufacturer"
          echo Mi6-Arch > "$G/strings/0x409/product"
          mkdir -p "$G/configs/c.1/strings/0x409"
          echo rndis > "$G/configs/c.1/strings/0x409/configuration"
          mkdir -p "$G/functions/rndis.usb0"
          ln -sf "$G/functions/rndis.usb0" "$G/configs/c.1/rndis.usb0"
          echo 0xEF > "$G/bDeviceClass"
          echo 0x02 > "$G/bDeviceSubClass"
          echo 0x01 > "$G/bDeviceProtocol"
          echo 1 > "$G/os_desc/use"
          echo 0xcd > "$G/os_desc/b_vendor_code"
          echo MSFT100 > "$G/os_desc/qw_sign"
          mkdir -p "$G/functions/rndis.usb0/os_desc/interface.rndis"
          echo RNDIS > "$G/functions/rndis.usb0/os_desc/interface.rndis/compatible_id"
          echo 5162001 > "$G/functions/rndis.usb0/os_desc/interface.rndis/sub_compatible_id"
          ln -sf "$G/configs/c.1" "$G/os_desc/c.1"
          UDC=$(ls /sys/class/udc | grep . | head -1)
          [ -n "$UDC" ] && echo "$UDC" > "$G/UDC"
          GADGETEOF
          chmod +x /newroot/usr/local/bin/usb-gadget.sh

          mkdir -p /newroot/etc/systemd/system/multi-user.target.wants
          ln -sf /etc/systemd/system/usb-gadget.service /newroot/etc/systemd/system/multi-user.target.wants/usb-gadget.service

          CFG=/newroot/etc/ssh/sshd_config
          sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' "$CFG" 2>/dev/null
          grep -q '^PermitRootLogin' "$CFG" 2>/dev/null || echo 'PermitRootLogin yes' >> "$CFG"
          sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' "$CFG" 2>/dev/null
          grep -q '^PasswordAuthentication' "$CFG" 2>/dev/null || echo 'PasswordAuthentication yes' >> "$CFG"
          mkdir -p /newroot/etc/ssh/sshd_config.d
          printf 'PermitRootLogin yes\nPasswordAuthentication yes\n' > /newroot/etc/ssh/sshd_config.d/99-root.conf
          chmod 644 /newroot/etc/ssh/sshd_config.d/99-root.conf

          mkdir -p /sys/kernel/config
          mount -t configfs none /sys/kernel/config 2>/dev/null
          G=/sys/kernel/config/usb_gadget/g1
          mkdir -p "$G"
          echo 0x1d6b > "$G/idVendor"
          echo 0x0105 > "$G/idProduct"
          mkdir -p "$G/strings/0x409"
          echo sagit-archlinux > "$G/strings/0x409/serialnumber"
          echo Xiaomi > "$G/strings/0x409/manufacturer"
          echo Mi6-Arch > "$G/strings/0x409/product"
          mkdir -p "$G/configs/c.1/strings/0x409"
          echo rndis > "$G/configs/c.1/strings/0x409/configuration"
          mkdir -p "$G/functions/rndis.usb0"
          ln -sf "$G/functions/rndis.usb0" "$G/configs/c.1/rndis.usb0"
          echo 0xEF > "$G/bDeviceClass"
          echo 0x02 > "$G/bDeviceSubClass"
          echo 0x01 > "$G/bDeviceProtocol"
          echo 1 > "$G/os_desc/use"
          echo 0xcd > "$G/os_desc/b_vendor_code"
          echo MSFT100 > "$G/os_desc/qw_sign"
          mkdir -p "$G/functions/rndis.usb0/os_desc/interface.rndis"
          echo RNDIS > "$G/functions/rndis.usb0/os_desc/interface.rndis/compatible_id"
          echo 5162001 > "$G/functions/rndis.usb0/os_desc/interface.rndis/sub_compatible_id"
          ln -sf "$G/configs/c.1" "$G/os_desc/c.1"
          UDC=$(ls /sys/class/udc | grep . | head -1)
          [ -n "$UDC" ] && echo "$UDC" > "$G/UDC"

          i=0
          while [ ! -e /sys/class/net/usb0 ] && [ $i -lt 20 ]; do
            i=$((i+1))
            sleep 1
          done
          ifconfig usb0 192.168.42.1 netmask 255.255.255.0 up 2>/dev/null

          mount --move /dev /newroot/dev
          mount --move /proc /newroot/proc
          mount --move /sys /newroot/sys
          mkdir -p /newroot/dev/pts /newroot/dev/shm /newroot/run /newroot/sys/fs/cgroup
          mount -t devpts devpts /newroot/dev/pts 2>/dev/null
          mount -t tmpfs -o mode=1777,nosuid,nodev shm /newroot/dev/shm 2>/dev/null
          mount -t tmpfs -o mode=0755,nosuid,nodev run /newroot/run 2>/dev/null
          mount -t cgroup2 none /newroot/sys/fs/cgroup 2>/dev/null
          exec switch_root /newroot /sbin/init
          INITEOF
          chmod +x initramfs/init
          cd initramfs
          find . | cpio -o -H newc 2>/dev/null | gzip -9 > /tmp/initramfs.gz
          ls -lh /tmp/initramfs.gz

      - name: Package boot.img
        run: |
          set -eux
          cd kernel
          cat > /tmp/bootimg.cfg <<'CFGEOF'
          bootsize = 67108864
          pagesize = 4096
          kerneladdr = 0x00008000
          ramdiskaddr = 0x01000000
          secondaddr = 0x00F00000
          tagsaddr = 0x00000100
          name = sagit-archlinux
          cmdline = console=ttyMSM0,115200n8 root=/dev/sda17 rw rootwait rootfstype=ext4 earlycon panic=30
          CFGEOF
          abootimg --create /tmp/boot.img -f /tmp/bootimg.cfg -k Image.gz-dtb -r /tmp/initramfs.gz
          abootimg -i /tmp/boot.img
          ls -lh /tmp/boot.img
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp /tmp/boot.img /tmp/modules.tar.gz "$GITHUB_WORKSPACE/out/"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/
          retention-days: 30

      - name: Cache arch tarball
        uses: actions/cache@v4
        with:
          path: /tmp/arch.tar.gz
          key: archlinuxarm-aarch64-latest-20261103

      - name: Download Arch rootfs tarball
        run: |
          set -eux
          if [ -s /tmp/arch.tar.gz ] && [ "$(stat -c%s /tmp/arch.tar.gz)" -gt 700000000 ]; then
            echo "cached tarball, skip download"
            tar -tzf /tmp/arch.tar.gz | head -3
            exit 0
          fi
          url=""
          for u in \
            http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz \
            https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/os/ArchLinuxARM-aarch64-latest.tar.gz \
            http://mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz; do
            echo "trying $u"
            if curl -fSL --retry 2 --connect-timeout 20 --max-time 1800 -o /tmp/arch.tar.gz "$u"; then
              url="$u"; break
            fi
          done
          test -n "$url"
          echo "downloaded from $url"
          ls -lh /tmp/arch.tar.gz
          tar -tzf /tmp/arch.tar.gz | head -3

      - name: Build ext4 rootfs image
        run: |
          set -eux
          truncate -s "$ROOTFS_BYTES" /tmp/rootfs.img
          sudo mkfs.ext4 -F -L archroot -m 0 /tmp/rootfs.img
          sudo mkdir -p /mnt/root
          sudo mount -o loop /tmp/rootfs.img /mnt/root
          sudo tar -xzf /tmp/arch.tar.gz -C /mnt/root --numeric-owner
          sudo cp /usr/bin/qemu-aarch64-static /mnt/root/usr/bin/
          sudo mount --bind /proc /mnt/root/proc
          sudo mount --bind /sys /mnt/root/sys
          sudo mount --bind /dev /mnt/root/dev
          sudo mkdir -p /mnt/root/dev/pts
          sudo mount --bind /dev/pts /mnt/root/dev/pts
          echo "host resolv.conf:"; cat /etc/resolv.conf
          sudo sh -c 'printf "nameserver 168.63.129.16\nnameserver 8.8.8.8\nnameserver 1.1.1.1\n" > /mnt/root/etc/resolv.conf'
          for h in mirror.archlinuxarm.org mirrors.tuna.tsinghua.edu.cn; do
            for ip in $(getent ahostsv4 "$h" | awk '{print $1}' | sort -u | head -4); do
              echo "$ip $h"
            done | sudo tee -a /mnt/root/etc/hosts
          done
          echo "chroot hosts:"; sudo tail -12 /mnt/root/etc/hosts
          EFF=$(curl -sSL -o /dev/null -w '%{url_effective}' http://mirror.archlinuxarm.org/archlinuxarm/aarch64/core/core.db)
          MHOST=$(echo "$EFF" | sed -E 's#^http://([^/]+).*#\1#')
          echo "effective mirror host: $MHOST"
          for ip in $(getent ahostsv4 "$MHOST" | awk '{print $1}' | sort -u); do
            echo "$ip $MHOST"
          done | sudo tee -a /mnt/root/etc/hosts
          sudo bash -c "cat > /mnt/root/etc/pacman.d/mirrorlist <<'EOF'
          Server = http://$MHOST/\$arch/\$repo
          EOF"
          sudo cat /mnt/root/etc/pacman.d/mirrorlist
          ls /mnt/root

      - name: Install packages in rootfs
        run: |
          set -eux
          cat > /tmp/setup.sh <<'SETUPEOF'
          #!/bin/bash
          set -eux
          echo "resolve check:"
          cat /etc/pacman.d/mirrorlist
          if pacman --disable-sandbox -V >/dev/null 2>&1; then
            PM="pacman --disable-sandbox"
          else
            PM="pacman"
          fi
          pacman-key --init
          pacman-key --populate archlinuxarm
          $PM -Sy --noconfirm
          $PM -S --noconfirm --needed \
            openssh networkmanager wpa_supplicant iw dnsmasq \
            linux-firmware-qcom wireless-regdb \
            sudo vim nano htop git mesa
          $PM -S --noconfirm --needed weston seatd || echo "optional packages skipped"
          rm -rf /var/cache/pacman/pkg/*
          if [ -d /usr/lib/firmware ]; then
            find /usr/lib/firmware -mindepth 1 -maxdepth 1 \
              ! -name ath10k ! -name qcom ! -name 'regulatory.db' ! -name 'regulatory.db.p7s' \
              -exec rm -rf {} +
          fi
          echo "rootfs size:"; du -sh /usr /var 2>/dev/null || true
          mkdir -p /etc/systemd/system/multi-user.target.wants
          ln -sf /usr/lib/systemd/system/sshd.service /etc/systemd/system/multi-user.target.wants/sshd.service
          ln -sf /usr/lib/systemd/system/NetworkManager.service /etc/systemd/system/multi-user.target.wants/NetworkManager.service
          printf "root:root\n" | chpasswd
          echo "LABEL=archroot / ext4 defaults,noatime 0 1" > /etc/fstab
          echo sagit-archlinux > /etc/hostname

          mkdir -p /etc/ssh/sshd_config.d
          printf 'PermitRootLogin yes\nPasswordAuthentication yes\n' > /etc/ssh/sshd_config.d/99-root.conf
          chmod 644 /etc/ssh/sshd_config.d/99-root.conf

          mkdir -p /etc/NetworkManager/conf.d
          cat > /etc/NetworkManager/conf.d/99-usb0-unmanaged.conf <<'NMEOF'
          [keyfile]
          unmanaged-devices=interface-name:usb0
          NMEOF

          cat > /usr/local/bin/usb-gadget.sh <<'GADGETEOF'
          #!/bin/sh
          set -e
          mountpoint -q /sys/kernel/config || mount -t configfs none /sys/kernel/config
          G=/sys/kernel/config/usb_gadget/g1
          [ -s "$G/UDC" ] && exit 0
          mkdir -p "$G"
          echo 0x1d6b > "$G/idVendor"
          echo 0x0105 > "$G/idProduct"
          mkdir -p "$G/strings/0x409"
          echo sagit-archlinux > "$G/strings/0x409/serialnumber"
          echo Xiaomi > "$G/strings/0x409/manufacturer"
          echo Mi6-Arch > "$G/strings/0x409/product"
          mkdir -p "$G/configs/c.1/strings/0x409"
          echo rndis > "$G/configs/c.1/strings/0x409/configuration"
          mkdir -p "$G/functions/rndis.usb0"
          ln -sf "$G/functions/rndis.usb0" "$G/configs/c.1/rndis.usb0"
          echo 0xEF > "$G/bDeviceClass"
          echo 0x02 > "$G/bDeviceSubClass"
          echo 0x01 > "$G/bDeviceProtocol"
          echo 1 > "$G/os_desc/use"
          echo 0xcd > "$G/os_desc/b_vendor_code"
          echo MSFT100 > "$G/os_desc/qw_sign"
          mkdir -p "$G/functions/rndis.usb0/os_desc/interface.rndis"
          echo RNDIS > "$G/functions/rndis.usb0/os_desc/interface.rndis/compatible_id"
          echo 5162001 > "$G/functions/rndis.usb0/os_desc/interface.rndis/sub_compatible_id"
          ln -sf "$G/configs/c.1" "$G/os_desc/c.1"
          UDC=$(ls /sys/class/udc | grep . | head -1)
          [ -n "$UDC" ] && echo "$UDC" > "$G/UDC"
          GADGETEOF
          chmod +x /usr/local/bin/usb-gadget.sh

          cat > /etc/systemd/system/usb-gadget.service <<'UNITEOF'
          [Unit]
          Description=USB RNDIS gadget fallback
          After=local-fs.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/bin/usb-gadget.sh

          [Install]
          WantedBy=multi-user.target
          UNITEOF
          ln -sf /etc/systemd/system/usb-gadget.service /etc/systemd/system/multi-user.target.wants/usb-gadget.service

          cat > /usr/local/bin/usb0-net.sh <<'USB0EOF'
          #!/bin/sh
          set -u
          i=0
          while [ ! -e /sys/class/net/usb0 ] && [ "$i" -lt 30 ]; do
              sleep 1
              i=$((i + 1))
          done
          [ -e /sys/class/net/usb0 ] || exit 0

          ip link set usb0 up 2>/dev/null || true
          ip addr replace 192.168.42.1/24 dev usb0 2>/dev/null || true

          exec dnsmasq \
              --keep-in-foreground \
              --port=0 \
              --interface=usb0 \
              --bind-interfaces \
              --dhcp-range=192.168.42.2,192.168.42.20,255.255.255.0,12h \
              --dhcp-option=3,192.168.42.1 \
              --dhcp-option=6,192.168.42.1 \
              --dhcp-authoritative \
              --no-hosts \
              --no-resolv \
              --leasefile-ro \
              --pid-file=/run/usb0-dnsmasq.pid \
              --log-facility=/var/log/usb0-dnsmasq.log
          USB0EOF
          chmod +x /usr/local/bin/usb0-net.sh

          cat > /etc/systemd/system/usb0-net.service <<'UNITEOF2'
          [Unit]
          Description=usb0 static IP + DHCP for USB gadget SSH
          After=multi-user.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/usb0-net.sh
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNITEOF2
          ln -sf /etc/systemd/system/usb0-net.service /etc/systemd/system/multi-user.target.wants/usb0-net.service
          SETUPEOF
          sudo cp /tmp/setup.sh /mnt/root/setup.sh
          sudo chmod +x /mnt/root/setup.sh
          sudo chroot /mnt/root /setup.sh

      - name: Copy kernel modules into rootfs
        run: |
          set -eux
          sudo tar -xzf /tmp/modules.tar.gz -C /mnt/root/
          sudo find /mnt/root/lib/modules -name '*.ko.xz' -exec xz -d {} \;
          sudo chroot /mnt/root /bin/bash -c 'DEP=$(ls /lib/modules | head -1); echo "modules: $DEP"; depmod -a "$DEP" || true'

      - name: Unmount rootfs
        run: |
          set -eux
          sudo fuser -vm /mnt/root || true
          sudo umount -R /mnt/root || sudo umount -Rl /mnt/root || true
          mount | grep /mnt/root || true
          for d in $(losetup -j /tmp/rootfs.img | cut -d: -f1); do sudo losetup -d "$d" || true; done
          sudo e2fsck -f -y /tmp/rootfs.img || true
          ls -lh /tmp/rootfs.img
          du -h /tmp/rootfs.img

      - name: Convert to sparse image
        run: |
          set -eux
          if command -v img2simg >/dev/null 2>&1; then
            img2simg /tmp/rootfs.img /tmp/rootfs.simg || python3 scripts/mk_sparse.py /tmp/rootfs.img /tmp/rootfs.simg
          else
            python3 scripts/mk_sparse.py /tmp/rootfs.img /tmp/rootfs.simg
          fi
          ls -lh /tmp/rootfs.simg
          sha256sum /tmp/rootfs.simg /tmp/boot.img
          mkdir -p "$GITHUB_WORKSPACE/out"
          rm -f "$GITHUB_WORKSPACE"/out/rootfs.simg.part*
          split -b 1900M -d -a 2 /tmp/rootfs.simg "$GITHUB_WORKSPACE/out/rootfs.simg.part"
          ls -lh "$GITHUB_WORKSPACE/out"
          sha256sum "$GITHUB_WORKSPACE"/out/rootfs.simg.part*

      - name: Create release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" \
            out/boot.img out/rootfs.simg.part* out/modules.tar.gz \
            --title "sagit archlinux $TAG" \
            --notes "kernel: $(cat /tmp/krel.txt)
            fixes: touch(I2C_QUP builtin + RMI4), RTC(pm8xxx), battery(qcom_fg), GPU fw(a530), regulatory.db,
            initramfs USB gadget+sshd drop-in, usb0 static IP+DHCP, gadget fallback service
            known: WiFi needs WCNSS/QMI endpoint, audio needs ADSP firmware (both absent from this tree/fw)
            合并分片后刷入: cat rootfs.simg.part* > rootfs.simg (Windows: copy /b rootfs.simg.part00+rootfs.simg.part01 rootfs.simg)" \
            --repo "${{ github.repository }}"
